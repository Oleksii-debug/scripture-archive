name: R06 D2 complete node materializer

on:
  push:
    branches:
      - r06-compose-d2-materialized-consumption-0927-sol
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r06-d2-complete-node-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect complete canonical node materialization
        id: state
        shell: bash
        run: |
          set -euo pipefail
          root="docs/campaigns/PA/R06_DEV2_MATERIALIZATION_05"
          if [[ -f "$root/node_hash_index.json" ]] && [[ -f "$root/nodes/part_026.jsonl" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Complete-node authority already present; verification continues in hosted tests."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover pinned complete nodes and verify authority
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_commit="0e913d3cb001ec3f5dff3e6aa0a61069d05ed101"
          source_path="release_inputs/dev2_w2_24/DEV_B_STAGE05_RECORD_SPLIT_STAGING.zip"
          expected_zip="b681ea26d985eb754bde02a77254d40ab0920061edb9226fae7921a6740a06c0"
          transport="$RUNNER_TEMP/d2-stage05.zip"
          git fetch --no-tags origin "$source_commit"
          git show "$source_commit:$source_path" > "$transport"
          actual_zip="$(sha256sum "$transport" | awk '{print $1}')"
          test "$actual_zip" = "$expected_zip"
          unzip -t "$transport" >/dev/null
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q "$transport" -d "$tmp"

          python - "$tmp" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          extracted = pathlib.Path(sys.argv[1]) / "D2_MATERIALIZATION"
          repo_root = pathlib.Path("docs/campaigns/PA/R06_DEV2_MATERIALIZATION_05")
          manifest = json.loads((repo_root / "MATERIALIZATION_MANIFEST_v1.0.json").read_text(encoding="utf-8"))
          spec = manifest["collections"]["nodes"]
          expected_parts = [f"nodes/part_{i:03d}.jsonl" for i in range(1, 27)]
          if spec.get("parts") != expected_parts:
              raise SystemExit("D2_NODE_MANIFEST_PART_SET_MISMATCH")
          if spec.get("count") != 386:
              raise SystemExit(f"D2_NODE_MANIFEST_COUNT_MISMATCH {spec.get('count')}")
          expected_aggregate = "fc7e8b7e01cba9614d66c4e756862cfd759f155deaf2ed83c798c6bc30127123"
          if spec.get("aggregate_sha256") != expected_aggregate:
              raise SystemExit("D2_NODE_MANIFEST_AGGREGATE_PIN_MISMATCH")

          index_path = extracted / "node_hash_index.json"
          index = json.loads(index_path.read_text(encoding="utf-8"))
          if index.get("record_count") != 386:
              raise SystemExit(f"D2_NODE_INDEX_COUNT_MISMATCH {index.get('record_count')}")
          if index.get("aggregate_sha256") != expected_aggregate:
              raise SystemExit("D2_NODE_INDEX_AGGREGATE_MISMATCH")
          expected = {}
          for item in index.get("records", []):
              if not isinstance(item, dict) or not isinstance(item.get("id"), str):
                  raise SystemExit("D2_NODE_INDEX_RECORD_INVALID")
              node_id = item["id"]
              digest = item.get("sha256")
              if node_id in expected or not isinstance(digest, str) or len(digest) != 64:
                  raise SystemExit(f"D2_NODE_INDEX_ENTRY_INVALID {node_id}")
              expected[node_id] = digest.lower()
          if len(expected) != 386:
              raise SystemExit(f"D2_NODE_INDEX_UNIQUE_COUNT_MISMATCH {len(expected)}")

          actual = {}
          seen_parts = []
          for rel in expected_parts:
              path = extracted / rel
              if not path.is_file():
                  raise SystemExit(f"D2_NODE_PART_MISSING {rel}")
              seen_parts.append(rel)
              for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if not line.strip():
                      continue
                  record = json.loads(line)
                  node_id = record.get("node_id")
                  if not isinstance(node_id, str) or not node_id or node_id in actual:
                      raise SystemExit(f"D2_NODE_ID_INVALID_OR_DUPLICATE {rel}:{line_number}:{node_id}")
                  canonical = json.dumps(
                      record,
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(",", ":"),
                      allow_nan=False,
                  ).encode("utf-8")
                  actual[node_id] = hashlib.sha256(canonical).hexdigest()
          if len(actual) != 386 or set(actual) != set(expected):
              missing = sorted(set(expected) - set(actual))
              extra = sorted(set(actual) - set(expected))
              raise SystemExit(f"D2_NODE_ID_SET_MISMATCH count={len(actual)} missing={missing[:5]} extra={extra[:5]}")
          mismatches = [node_id for node_id in sorted(actual) if actual[node_id] != expected[node_id]]
          if mismatches:
              raise SystemExit(f"D2_NODE_RECORD_HASH_MISMATCH {mismatches[:5]}")
          payload = "".join(f"{node_id}\t{actual[node_id]}\n" for node_id in sorted(actual)).encode("utf-8")
          aggregate = hashlib.sha256(payload).hexdigest()
          if aggregate != expected_aggregate:
              raise SystemExit(f"D2_NODE_AGGREGATE_MISMATCH {aggregate}")

          archive_metadata = (extracted / "mission_metadata.json").read_bytes()
          current_metadata = (repo_root / "mission_metadata.json").read_bytes()
          if archive_metadata != current_metadata:
              raise SystemExit("D2_MISSION_METADATA_DRIFT_FROM_PINNED_ARCHIVE")
          print("D2_COMPLETE_NODE_AUTHORITY_PASS", f"records={len(actual)}", f"aggregate={aggregate}", "parts=26")
          PY

          root="docs/campaigns/PA/R06_DEV2_MATERIALIZATION_05"
          rm -rf "$root/nodes"
          mkdir -p "$root/nodes"
          cp "$tmp/D2_MATERIALIZATION"/nodes/part_*.jsonl "$root/nodes/"
          cp "$tmp/D2_MATERIALIZATION/node_hash_index.json" "$root/node_hash_index.json"

          python - <<'PY'
          import pathlib
          import subprocess
          root = "docs/campaigns/PA/R06_DEV2_MATERIALIZATION_05/"
          lines = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"], text=True
          ).splitlines()
          changed = []
          for line in lines:
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.append(path)
          unexpected = [path for path in changed if not path.startswith(root + "nodes/") and path != root + "node_hash_index.json"]
          if unexpected:
              raise SystemExit(f"D2_NODE_UNEXPECTED_MUTATION {unexpected[:10]}")
          expected_new = {root + f"nodes/part_{i:03d}.jsonl" for i in range(1, 27)} | {root + "node_hash_index.json"}
          missing = sorted(expected_new - set(changed))
          if missing:
              raise SystemExit(f"D2_NODE_EXPECTED_MUTATION_MISSING {missing[:10]}")
          print("D2_COMPLETE_NODE_MUTATION_SCOPE_PASS", len(changed))
          PY

      - name: Commit verified complete node materialization
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="docs/campaigns/PA/R06_DEV2_MATERIALIZATION_05"
          git config user.name "scripture-archive-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add -A "$root/nodes" "$root/node_hash_index.json"
          git diff --cached --check
          git commit -m "R06 D2: materialize complete pinned node corpus"
          git push origin "HEAD:$GITHUB_REF_NAME"
