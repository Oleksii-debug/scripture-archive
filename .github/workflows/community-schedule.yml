name: Community schedule
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/community-schedule.yml'
      - 'scripts/community-actions.mjs'
      - 'lib/community-*.mjs'
      - 'app/api/community/**'
permissions:
  contents: read
  id-token: write
concurrency:
  group: scripture-community-schedule
  cancel-in-progress: false
jobs:
  scheduled-activity:
    if: github.repository == 'Oleksii-debug/scripture-archive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/community-actions.mjs
