name: TEMP LN09 exact readback

on:
  push:
    branches:
      - r06-pedagogy-ln09-hints-0912-sol

permissions:
  contents: read

jobs:
  package-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bind exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Upload exact LN09 source bytes and validator
        uses: actions/upload-artifact@v4
        with:
          name: LN09-exact-repair-inputs-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            docs/campaigns/LN/LN-09_CANONICAL_v1.2/nodes_part_*.json
            tools/analyze_pedagogical_quality.py
