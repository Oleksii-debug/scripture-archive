name: R06 Packaged Mastery Qualification

on:
  pull_request:
    paths:
      - 'lanes/dev1/repair_overlay/frontend/index.html'
      - 'lanes/dev1/repair_overlay/frontend/mastery.js'
      - 'lanes/dev1/repair_overlay/tests/test_packaged_mastery_current.py'
      - '.github/workflows/r06-packaged-mastery-qualification.yml'

permissions:
  contents: read

concurrency:
  group: r06-packaged-mastery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-mastery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run packaged Mastery composition and executable lifecycle regression
        run: python lanes/dev1/repair_overlay/tests/test_packaged_mastery_current.py -v
