name: QA current package persistence restart fa836d

on:
  push:
    branches:
      - qa-current-package-persistence-restart-fa836d-0913-sol
    paths:
      - '.github/workflows/qa-current-package-persistence-restart-fa836d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence-restart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa836d79fcfd9ac5d8aacbf6a6be9f5a10183012
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact canonical package checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "fa836d79fcfd9ac5d8aacbf6a6be9f5a10183012"
      - name: Packaged Library and Research persistence
        working-directory: lanes/dev1/repair_overlay
        run: python tests/test_packaged_library_research_persistence.py
      - name: Known #146 composition dependency - restart/readback informational
        continue-on-error: true
        working-directory: lanes/dev1/repair_overlay
        run: python -c "import runpy,sys; sys.path.insert(0,'.'); runpy.run_path('tests/test_research_workspace_persistence_restart.py', run_name='__main__')"
      - name: Research persistence collision regression
        working-directory: lanes/dev1/repair_overlay
        run: python tests/test_research_persistence_collision_regression.py
      - name: Known #146 stale literal assertion - full UI test informational
        continue-on-error: true
        working-directory: lanes/dev1/repair_overlay
        run: python tests/test_research_persistence_ui.py
      - name: Research persistence semantic label and safe-DOM contract
        shell: python
        run: |
          from pathlib import Path
          ui = Path('lanes/dev1/repair_overlay/frontend/research-persistence.js').read_text(encoding='utf-8')
          required = ('textContent=value', 'sl.htmlFor=q.id', 'titleLabel.htmlFor=title.id', 'tagsLabel.htmlFor=tag.id', 'l.htmlFor=body.id', "status.setAttribute('role','status')")
          forbidden = ('innerHTML', 'outerHTML', 'insertAdjacentHTML', 'localStorage', 'sessionStorage', 'eval(', 'new Function')
          assert all(token in ui for token in required)
          assert all(token not in ui for token in forbidden)
      - name: Runtime memory persistence
        working-directory: runtime_engine
        env:
          PYTHONPATH: ${{ github.workspace }}/runtime_engine
        run: python tests/test_dev06_memory_persistence.py
      - name: Runtime persistence hardening
        working-directory: runtime_engine
        env:
          PYTHONPATH: ${{ github.workspace }}/runtime_engine
        run: python tests/test_dev06_persistence_hardening.py
      - name: Runtime persistence security
        working-directory: runtime_engine
        env:
          PYTHONPATH: ${{ github.workspace }}/runtime_engine
        run: python tests/test_persistence_security.py
      - name: Diff hygiene
        shell: bash
        run: git diff --check
