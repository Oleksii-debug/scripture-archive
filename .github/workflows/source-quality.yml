name: Scripture Archive source quality

# Source-only checks. Never deploy, contact real users, or write production D1.
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'db/**'
      - 'drizzle/**'
      - 'public/**'
      - 'content/**'
      - 'worker/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'package*.json'
      - 'requirements-test.txt'
      - '.github/workflows/source-quality.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'db/**'
      - 'drizzle/**'
      - 'public/**'
      - 'content/**'
      - 'worker/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'package*.json'
      - 'requirements-test.txt'
      - '.github/workflows/source-quality.yml'

permissions:
  contents: read

concurrency:
  group: scripture-source-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-disposable-integration:
    if: github.repository == 'Oleksii-debug/scripture-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install frozen JavaScript dependencies
        run: npm ci
      - name: Native Node regression suite
        run: npm test
      - name: TypeScript contracts
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build source without deployment
        run: npm run build
      - name: Disposable local Worker and D1 end-to-end tests
        run: npm run test:integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated Python test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Existing canonical Python validators
        run: python -m pytest -q tests
