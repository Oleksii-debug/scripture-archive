name: R06 QA67 exact-head constructor qualification

on:
  push:
    branches:
      - r06-qa67-c931-exact

jobs:
  qa67-constructor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prove candidate ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "c93145e816e1c1d1bc24e6db96da7a940e357fbb"
      - name: Reconstruct committed immutable DEV1 source for QA only
        shell: bash
        run: |
          cat lanes/dev1/source_parts/part-*.b64 | base64 -d > DEV1_R06_PLATFORM_SOURCE.zip
          echo "3edef808a6358c3d098bd973c70fefdbb5de93e14103b080a85a6ade04fad0e2  DEV1_R06_PLATFORM_SOURCE.zip" | sha256sum -c -
          python - <<'PY'
          import zipfile
          p = 'DEV1_R06_PLATFORM_SOURCE.zip'
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad is not None:
                  raise SystemExit(f'ZIP CRC failure: {bad}')
              names = z.namelist()
              if not names or not all(name == 'r06_platform/' or name.startswith('r06_platform/') for name in names):
                  raise SystemExit('Unexpected immutable source archive path shape')
              for name in names:
                  parts = name.replace('\\', '/').split('/')
                  if name.startswith('/') or '..' in parts:
                      raise SystemExit(f'Unsafe archive member: {name}')
              z.extractall('.')
          PY
      - name: Apply exact PR80 readable overlay
        shell: bash
        run: cp -R lanes/dev1/repair_overlay/. r06_platform/
      - name: Compile candidate constructor sources
        shell: bash
        run: |
          python -m compileall -q \
            r06_platform/scripture_archive_platform/authoring \
            r06_platform/scripture_archive_platform/domain \
            r06_platform/tests/test_authoring_service.py
      - name: Execute #67 constructor regressions
        shell: bash
        run: |
          cd r06_platform
          python -m unittest discover -s tests -p 'test_authoring_service.py' -v
