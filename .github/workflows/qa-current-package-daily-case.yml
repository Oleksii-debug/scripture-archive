name: QA Current Package Daily Case

on:
  push:
    branches:
      - qa-current-package-daily-case-0913-sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-daily-case:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Run packaged Daily Case projection and UI regression
        run: python -c "import pathlib,runpy,sys; root=pathlib.Path.cwd(); sys.path[:0]=[str(root/'lanes/dev1/repair_overlay'),str(root)]; runpy.run_path(str(root/'lanes/dev1/repair_overlay/tests/test_packaged_daily_case.py'),run_name='__main__')"
      - name: Run packaged Daily Case transport regression
        run: python -c "import pathlib,runpy,sys; root=pathlib.Path.cwd(); sys.path[:0]=[str(root/'lanes/dev1/repair_overlay'),str(root)]; runpy.run_path(str(root/'lanes/dev1/repair_overlay/tests/test_packaged_daily_case_transport_contract.py'),run_name='__main__')"
      - name: Diff hygiene
        shell: bash
        run: git diff --check
