name: QA PR191 Daily Case Runtime Lock

on:
  push:
    branches:
      - qa-pr191-daily-case-runtime-lock-0913-sol

permissions:
  contents: read

jobs:
  runtime-lock:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pythonpath: ".:lanes/dev1/repair_overlay"
          - os: windows-latest
            pythonpath: ".;lanes/dev1/repair_overlay"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ matrix.pythonpath }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind helper to exact PR head
        run: >-
          python -c "import subprocess,sys; e='deac1d2d7dad357d624d89f76d8cfc30f1f9ffac'; rc=subprocess.run(['git','merge-base','--is-ancestor',e,'HEAD']).returncode; files=subprocess.check_output(['git','diff','--name-only',e+'..HEAD'], text=True).splitlines(); print('candidate='+e); print('helper_diff='+repr(files)); sys.exit(0 if rc==0 and files==['.github/workflows/qa-pr191-daily-case-runtime-lock.yml'] else 1)"
      - name: Compile repaired gateway and regression
        run: >-
          python -m py_compile
          lanes/dev1/repair_overlay/scripture_archive_platform/application/runtime_gateway.py
          lanes/dev1/repair_overlay/tests/test_packaged_daily_case_runtime_lock.py
      - name: Execute Daily Case runtime-lock regression
        run: >-
          python -m unittest -v
          lanes.dev1.repair_overlay.tests.test_packaged_daily_case_runtime_lock
