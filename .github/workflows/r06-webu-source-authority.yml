name: R06 WEBU Source Authority

on:
  pull_request:
    paths:
      - '.github/workflows/r06-webu-source-authority.yml'
      - 'lanes/dev1/repair_overlay/scripture_archive_platform/content/data/engwebu_authority.json'
      - 'lanes/dev1/repair_overlay/scripture_archive_platform/content/data/engwebu_vpl.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-authority:
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      WEBU_URL: https://ebible.org/Scriptures/engwebu_vpl.zip
      HISTORICAL_CAPTURE_ARCHIVE_SHA256: 6442f15ee3b4360786c9cd0996ea3af8f3124744a61b7a9bd69e77ac5deab397
      EXPECTED_VPL_SHA256: 71c2ea1ecba86b62871b0e818c4302ea0a559a5cb9643ff05197a6243836fc2f
      DEST: lanes/dev1/repair_overlay/scripture_archive_platform/content/data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1

      - name: Confirm exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Fetch current official WEBU developer artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .webu-source
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --max-filesize 20000000 \
            --dump-header .webu-source/http-headers.txt \
            --output .webu-source/engwebu_vpl.zip "$WEBU_URL"
          observed="$(sha256sum .webu-source/engwebu_vpl.zip | cut -d' ' -f1)"
          printf '%s\n' "$observed" > .webu-source/observed-archive-sha256.txt
          if [ "$observed" = "$HISTORICAL_CAPTURE_ARCHIVE_SHA256" ]; then
            echo "WEBU archive container matches historical audited capture: $observed"
          else
            echo "WEBU archive container drift observed: historical=$HISTORICAL_CAPTURE_ARCHIVE_SHA256 current=$observed"
            echo "The job will continue only to verify the pinned Scripture payload byte-for-byte; container drift is not treated as payload equivalence."
          fi

      - name: Audit safe archive and capture reference-level upstream diff
        id: source_audit
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import zipfile

          root = pathlib.Path('.webu-source')
          archive = root / 'engwebu_vpl.zip'
          raw = archive.read_bytes()
          if len(raw) > 20_000_000:
              raise SystemExit('WEBU archive exceeds 20 MB safety bound')

          observed_archive_sha = hashlib.sha256(raw).hexdigest()
          historical_archive_sha = os.environ['HISTORICAL_CAPTURE_ARCHIVE_SHA256']
          expected_vpl_sha = os.environ['EXPECTED_VPL_SHA256']

          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'WEBU ZIP CRC failure: {bad}')
              entries = []
              total = 0
              for info in zf.infolist():
                  name = info.filename.replace('\\\\', '/')
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts or name.startswith('/'):
                      raise SystemExit(f'unsafe WEBU archive member: {name!r}')
                  if info.is_dir():
                      continue
                  total += info.file_size
                  if total > 50_000_000:
                      raise SystemExit('WEBU uncompressed size exceeds 50 MB safety bound')
                  entries.append({'path': name, 'size': info.file_size, 'crc32': f'{info.CRC:08x}'})
              try:
                  vpl = zf.read('engwebu_vpl.txt')
              except KeyError as exc:
                  raise SystemExit('official WEBU archive is missing engwebu_vpl.txt') from exc

          def inspect_vpl(payload: bytes, label: str) -> dict:
              try:
                  text = payload.decode('utf-8-sig')
              except UnicodeDecodeError as exc:
                  raise SystemExit(f'{label} VPL is not valid UTF-8: {exc}') from exc
              lines = text.splitlines()
              by_ref = {}
              book_codes = []
              for lineno, line in enumerate(lines, 1):
                  parts = line.split(' ', 2)
                  if len(parts) < 2 or ':' not in parts[1]:
                      raise SystemExit(f'{label} malformed VPL row {lineno}')
                  ref = parts[0] + ' ' + parts[1]
                  if ref in by_ref:
                      raise SystemExit(f'{label} duplicate VPL reference {ref}')
                  by_ref[ref] = line
                  if parts[0] not in book_codes:
                      book_codes.append(parts[0])
              return {
                  'lines': lines,
                  'by_ref': by_ref,
                  'book_codes': book_codes,
                  'empty_text_rows': sum(1 for line in lines if line.endswith(' ')),
                  'first_reference': next(iter(by_ref), None),
                  'last_reference': next(reversed(by_ref), None) if by_ref else None,
              }

          dest = pathlib.Path(os.environ['DEST'])
          checked_vpl = dest / 'engwebu_vpl.txt'
          if not checked_vpl.is_file():
              raise SystemExit('checked-in pinned WEBU VPL is missing')
          checked_bytes = checked_vpl.read_bytes()
          checked_sha = hashlib.sha256(checked_bytes).hexdigest()
          if checked_sha != expected_vpl_sha:
              raise SystemExit(
                  f'checked-in WEBU VPL authority drift: expected {expected_vpl_sha}, observed {checked_sha}'
              )

          current = inspect_vpl(vpl, 'current official')
          pinned = inspect_vpl(checked_bytes, 'checked-in pinned')
          vpl_sha = hashlib.sha256(vpl).hexdigest()

          current_refs = set(current['by_ref'])
          pinned_refs = set(pinned['by_ref'])
          added_refs = sorted(current_refs - pinned_refs)
          removed_refs = sorted(pinned_refs - current_refs)
          changed_refs = sorted(
              ref for ref in current_refs & pinned_refs
              if current['by_ref'][ref] != pinned['by_ref'][ref]
          )
          changed_detail = [
              {
                  'reference': ref,
                  'pinned_line': pinned['by_ref'][ref],
                  'current_line': current['by_ref'][ref],
                  'pinned_line_sha256': hashlib.sha256(pinned['by_ref'][ref].encode('utf-8')).hexdigest(),
                  'current_line_sha256': hashlib.sha256(current['by_ref'][ref].encode('utf-8')).hexdigest(),
              }
              for ref in changed_refs
          ]

          authority_path = dest / 'engwebu_authority.json'
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          required = {
              'schema': 'scripture.webu.bundled-authority.v1',
              'translation_id': 'engwebu',
              'translation_name': 'World English Bible Updated',
              'source_url': os.environ['WEBU_URL'],
              'source_site': 'https://ebible.org/engwebu/',
              'license': 'Public Domain',
              'source_tier': 'TX1',
              'archive_sha256': historical_archive_sha,
              'vpl_sha256': expected_vpl_sha,
              'vpl_rows': 38058,
              'empty_text_rows': 29,
              'runtime_network_required': False,
          }
          for key, expected in required.items():
              if authority.get(key) != expected:
                  raise SystemExit(f'checked-in authority mismatch for {key}: {authority.get(key)!r} != {expected!r}')
          if authority.get('book_codes') != pinned['book_codes']:
              raise SystemExit('checked-in authority book-code order differs from pinned bundled payload')

          payload_matches = vpl_sha == expected_vpl_sha and checked_bytes == vpl
          report = {
              'schema': 'scripture.webu.current-source-reaudit.v2',
              'translation_id': 'engwebu',
              'source_url': os.environ['WEBU_URL'],
              'historical_capture_archive_sha256': historical_archive_sha,
              'observed_archive_sha256': observed_archive_sha,
              'archive_container_matches_historical_capture': observed_archive_sha == historical_archive_sha,
              'observed_archive_size': len(raw),
              'pinned_vpl_sha256': expected_vpl_sha,
              'observed_vpl_sha256': vpl_sha,
              'scripture_payload_matches_pinned_source': payload_matches,
              'pinned': {
                  'bytes': len(checked_bytes),
                  'vpl_rows': len(pinned['lines']),
                  'empty_text_rows': pinned['empty_text_rows'],
                  'book_codes': pinned['book_codes'],
                  'first_reference': pinned['first_reference'],
                  'last_reference': pinned['last_reference'],
              },
              'current': {
                  'bytes': len(vpl),
                  'vpl_rows': len(current['lines']),
                  'empty_text_rows': current['empty_text_rows'],
                  'book_codes': current['book_codes'],
                  'first_reference': current['first_reference'],
                  'last_reference': current['last_reference'],
              },
              'reference_diff': {
                  'added_count': len(added_refs),
                  'removed_count': len(removed_refs),
                  'changed_count': len(changed_refs),
                  'added_refs': added_refs,
                  'removed_refs': removed_refs,
                  'changed': changed_detail,
              },
              'entries': entries,
              'decision': 'MATCH_PINNED_AUTHORITY' if payload_matches else 'SOURCE_REAUDIT_REQUIRED',
          }
          (root / 'current-source-verification.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          output = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as fh:
              fh.write(f"payload_changed={'false' if payload_matches else 'true'}\n")
              fh.write(f"observed_vpl_sha256={vpl_sha}\n")
              fh.write(f"changed_refs={len(changed_refs)}\n")
              fh.write(f"added_refs={len(added_refs)}\n")
              fh.write(f"removed_refs={len(removed_refs)}\n")
          print(json.dumps({
              'observed_archive_sha256': observed_archive_sha,
              'observed_vpl_sha256': vpl_sha,
              'payload_matches_pinned_source': payload_matches,
              'pinned_rows': len(pinned['lines']),
              'current_rows': len(current['lines']),
              'added_refs': len(added_refs),
              'removed_refs': len(removed_refs),
              'changed_refs': len(changed_refs),
          }, sort_keys=True))

      - name: Upload current official-source verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webu-current-source-verification-${{ env.EXPECTED_HEAD }}
          path: |
            .webu-source/current-source-verification.json
            .webu-source/observed-archive-sha256.txt
            .webu-source/http-headers.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce source identity after evidence capture
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          changed="${{ steps.source_audit.outputs.payload_changed }}"
          if [ "$changed" != "false" ]; then
            echo "OFFICIAL WEBU SCRIPTURE PAYLOAD CHANGED; source re-audit/reconciliation required. Structured reference diff was uploaded."
            echo "observed_vpl_sha256=${{ steps.source_audit.outputs.observed_vpl_sha256 }}"
            echo "changed_refs=${{ steps.source_audit.outputs.changed_refs }} added_refs=${{ steps.source_audit.outputs.added_refs }} removed_refs=${{ steps.source_audit.outputs.removed_refs }}"
            exit 1
          fi
          echo "WEBU_SOURCE_IDENTITY_PASS"

      - name: Prove qualification is read-only and checkout remains exact
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --check
          git diff --exit-code
          test "$(sha256sum "$DEST/engwebu_vpl.txt" | cut -d' ' -f1)" = "$EXPECTED_VPL_SHA256"
