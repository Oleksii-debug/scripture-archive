name: R06 WEBU One-Shot Official Snapshot Reconciliation

on:
  push:
    branches:
      - r06-compose-packaged-full-bible-webu-0913-sol
    paths:
      - .github/workflows/r06-webu-one-shot-reconcile.yml

permissions:
  contents: write

concurrency:
  group: r06-webu-one-shot-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      WEBU_URL: https://ebible.org/Scriptures/engwebu_vpl.zip
      OLD_VPL_SHA256: 71c2ea1ecba86b62871b0e818c4302ea0a559a5cb9643ff05197a6243836fc2f
      CURRENT_ARCHIVE_SHA256: 1007fb45782a4abd9444d4225fd768fb00a150466b9fb9fcf6f6ad175b73feb6
      CURRENT_VPL_SHA256: 8cac735abda379045fa2c5f43217410ad47a45ac592f3801116ab0da41a810d8
      DEST: lanes/dev1/repair_overlay/scripture_archive_platform/content/data/engwebu_vpl.txt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact old snapshot and fetch audited official source
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$DEST" | cut -d' ' -f1)" = "$OLD_VPL_SHA256"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --max-filesize 20000000 \
            --output /tmp/engwebu_vpl.zip "$WEBU_URL"
          test "$(sha256sum /tmp/engwebu_vpl.zip | cut -d' ' -f1)" = "$CURRENT_ARCHIVE_SHA256"

      - name: Prove exact audited ten-reference delta and materialize current VPL
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import zipfile

          dest = Path(os.environ["DEST"])
          old = dest.read_bytes()
          with zipfile.ZipFile("/tmp/engwebu_vpl.zip") as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failure: {bad}")
              current = zf.read("engwebu_vpl.txt")

          if hashlib.sha256(old).hexdigest() != os.environ["OLD_VPL_SHA256"]:
              raise SystemExit("old bundled VPL identity moved")
          if hashlib.sha256(current).hexdigest() != os.environ["CURRENT_VPL_SHA256"]:
              raise SystemExit("current official VPL identity moved")
          if len(current) != 5_320_533:
              raise SystemExit(f"unexpected current VPL byte size: {len(current)}")

          def inspect(payload):
              text = payload.decode("utf-8-sig")
              lines = text.splitlines()
              by_ref = {}
              books = []
              for lineno, line in enumerate(lines, 1):
                  parts = line.split(" ", 2)
                  if len(parts) < 2 or ":" not in parts[1]:
                      raise SystemExit(f"malformed VPL row {lineno}")
                  ref = parts[0] + " " + parts[1]
                  if ref in by_ref:
                      raise SystemExit(f"duplicate VPL reference {ref}")
                  by_ref[ref] = line
                  if parts[0] not in books:
                      books.append(parts[0])
              return lines, by_ref, books

          old_lines, old_refs, old_books = inspect(old)
          cur_lines, cur_refs, cur_books = inspect(current)
          if len(cur_lines) != 38058 or sum(line.endswith(" ") for line in cur_lines) != 29:
              raise SystemExit("current VPL structural counts changed")
          if cur_books != old_books or len(cur_books) != 81:
              raise SystemExit("current VPL ordered book codes changed")

          old_set, cur_set = set(old_refs), set(cur_refs)
          if old_set != cur_set:
              raise SystemExit("current VPL added or removed references")
          changed = sorted(ref for ref in old_set if old_refs[ref] != cur_refs[ref])
          expected = [
              "DAN 11:20", "DAN 11:21", "DAN 11:24", "DAN 4:26", "DAN 9:11",
              "DNG 11:20", "DNG 11:21", "DNG 11:24", "DNG 4:26", "DNG 9:11",
          ]
          if changed != expected:
              raise SystemExit(f"unexpected changed-reference inventory: {changed!r}")

          expected_line_hashes = {
              "DAN 11:20": "1cc07bb46873f69f5ac5fc4ccbd8a7421050b47a9190884469e1f2440f712505",
              "DAN 11:21": "3abcf45188d972154b0487254761e97d7b5e4737205059466b08f1041f69611d",
              "DAN 11:24": "f2528239a871d53e1bcdf8cb1599ba96c2ccc80b054cee85f20c4e28e9721b21",
              "DAN 4:26": "4853da560105ac8a433a2f3a39edcb8a6b50834f529949ef92364be93a7ef965",
              "DAN 9:11": "2f7e353340fa88c7f2991a183e966d788f5e70fb20807161de360f90980abd85",
              "DNG 11:20": "f96c876d09dd389b5e97f0704cfb17ef934c079ff94e1adafabe0216d1904993",
              "DNG 11:21": "dfc14f96b8317bd7677581923112fec5004550ced966d657ea4c62e827ff2211",
              "DNG 11:24": "52a4e37b8e7ab4ad7c96dcf0d988c89c0a2238574b75388445985ba8812f8db8",
              "DNG 4:26": "8d06e8040c311cdf3c966d5b72aac806035f687a954a8adc1d048a222f7d2e33",
              "DNG 9:11": "df351b0d3cefd895869c3064551bf1cc3485aed368e0a74a1be08fbc6dec6c1f",
          }
          for ref, expected_hash in expected_line_hashes.items():
              actual = hashlib.sha256(cur_refs[ref].encode("utf-8")).hexdigest()
              if actual != expected_hash:
                  raise SystemExit(f"current line identity moved for {ref}: {actual}")

          dest.write_bytes(current)
          if hashlib.sha256(dest.read_bytes()).hexdigest() != os.environ["CURRENT_VPL_SHA256"]:
              raise SystemExit("materialized VPL hash mismatch")
          print("WEBU_EXACT_TEN_REFERENCE_RECONCILIATION_PASS")

      - name: Commit only the exact reconciled VPL
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$DEST" | cut -d' ' -f1)" = "$CURRENT_VPL_SHA256"
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(git diff --name-only)" = "$DEST"
          git config user.name "scripture-archive-reconciliation"
          git config user.email "actions@users.noreply.github.com"
          git add -- "$DEST"
          git diff --cached --name-only | grep -Fx "$DEST"
          git commit -m "R06 WEBU: materialize audited current official VPL"
          git push origin "HEAD:$GITHUB_REF_NAME"
