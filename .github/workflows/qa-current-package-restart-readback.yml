name: QA Current Package Restart Readback

on:
  push:
    branches:
      - qa-current-package-restart-readback-0913-sol
  workflow_dispatch:

permissions:
  contents: read

env:
  DONOR_SHA: 60e8dba23e656960162afd4f7764d4d042770ea9
  BASE_SOURCE_SHA256: 10fbd546ff4d985465b85b99f4f64bff95d9ec8b1f27132c6d21b4930c344c35

jobs:
  restart-readback:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm exact helper checkout and immutable package parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "fa836d79fcfd9ac5d8aacbf6a6be9f5a10183012"
      - name: Fetch immutable reconstruction donor
        shell: bash
        run: git fetch --no-tags --depth=1 origin "$DONOR_SHA"
      - name: Reconstruct, compose, and qualify restart readback on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qa_donor/release_inputs/dev1_finalprep02
          for i in $(seq 1 11); do
            part=$(printf 'part-%03d.b64' "$i")
            git show "$DONOR_SHA:release_inputs/dev1_finalprep02/$part" > ".qa_donor/release_inputs/dev1_finalprep02/$part"
          done
          git show "$DONOR_SHA:lanes/dev1/verify_source_archive.py" > .qa_donor/verify_source_archive.py
          git show "$DONOR_SHA:lanes/dev1/FINALPREP02_RESOLVED_SOURCE_SHA256.json" > .qa_donor/FINALPREP02_RESOLVED_SOURCE_SHA256.json
          git show "$DONOR_SHA:lanes/dev1/FINALPREP02_RESOLVED_SOURCE_MANIFEST.json" > .qa_donor/FINALPREP02_RESOLVED_SOURCE_MANIFEST.json
          cat .qa_donor/release_inputs/dev1_finalprep02/part-*.b64 | base64 -d > DEV1_R06_PLATFORM_SOURCE.zip
          python .qa_donor/verify_source_archive.py DEV1_R06_PLATFORM_SOURCE.zip "$BASE_SOURCE_SHA256"
          python -m zipfile -e DEV1_R06_PLATFORM_SOURCE.zip .
          test -d r06_platform
          cp -R lanes/dev1/repair_overlay/. r06_platform/
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/r06_platform${PYTHONPATH:+:$PYTHONPATH}"
          python lanes/dev1/repair_overlay/tests/test_research_workspace_persistence_restart.py
          git diff --check
      - name: Reconstruct, compose, and qualify restart readback on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .qa_donor\release_inputs\dev1_finalprep02 | Out-Null
          $parts = @()
          1..11 | ForEach-Object {
            $part = 'part-{0:D3}.b64' -f $_
            $parts += (git show "$($env:DONOR_SHA):release_inputs/dev1_finalprep02/$part")
            if ($LASTEXITCODE -ne 0) { throw "Failed reading donor $part" }
          }
          $b64 = $parts -join ''
          [IO.File]::WriteAllBytes('DEV1_R06_PLATFORM_SOURCE.zip', [Convert]::FromBase64String($b64))
          git show "$($env:DONOR_SHA):lanes/dev1/verify_source_archive.py" | Set-Content -Encoding utf8NoBOM .qa_donor\verify_source_archive.py
          git show "$($env:DONOR_SHA):lanes/dev1/FINALPREP02_RESOLVED_SOURCE_SHA256.json" | Set-Content -Encoding utf8NoBOM .qa_donor\FINALPREP02_RESOLVED_SOURCE_SHA256.json
          git show "$($env:DONOR_SHA):lanes/dev1/FINALPREP02_RESOLVED_SOURCE_MANIFEST.json" | Set-Content -Encoding utf8NoBOM .qa_donor\FINALPREP02_RESOLVED_SOURCE_MANIFEST.json
          if ($LASTEXITCODE -ne 0) { throw 'Failed reading donor verifier/manifests' }
          python .qa_donor\verify_source_archive.py DEV1_R06_PLATFORM_SOURCE.zip $env:BASE_SOURCE_SHA256
          if ($LASTEXITCODE -ne 0) { throw "Archive verification failed with exit code $LASTEXITCODE" }
          Expand-Archive DEV1_R06_PLATFORM_SOURCE.zip -DestinationPath . -Force
          if (-not (Test-Path r06_platform -PathType Container)) { throw 'Verified archive did not extract r06_platform' }
          Copy-Item -Path lanes\dev1\repair_overlay\* -Destination r06_platform -Recurse -Force
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE;$env:GITHUB_WORKSPACE\r06_platform" + $(if ($env:PYTHONPATH) { ";$env:PYTHONPATH" } else { "" })
          python lanes\dev1\repair_overlay\tests\test_research_workspace_persistence_restart.py
          if ($LASTEXITCODE -ne 0) { throw "Restart/readback regression failed with exit code $LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Diff hygiene failed with exit code $LASTEXITCODE" }
