name: R06 DEV03 Visual Qualification

on:
  pull_request:
    paths:
      - 'lanes/dev1/repair_overlay/frontend/styles.css'
      - 'lanes/dev1/repair_overlay/frontend/styles.foundation.css'
      - 'lanes/dev1/repair_overlay/frontend/index.html'
      - 'lanes/dev1/repair_overlay/frontend/renderers-base.js'
      - 'lanes/dev1/repair_overlay/tests/test_visual_design.py'
      - 'lanes/dev1/repair_overlay/tests/test_visual_polish_contract.py'
      - '.github/workflows/r06-dev03-visual-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r06-dev03-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile exact visual contract tests
        working-directory: lanes/dev1/repair_overlay
        run: python -m py_compile tests/test_visual_design.py tests/test_visual_polish_contract.py
      - name: Run exact visual contract tests
        working-directory: lanes/dev1/repair_overlay
        run: python -m unittest discover -s tests -p "test_visual*.py" -v
