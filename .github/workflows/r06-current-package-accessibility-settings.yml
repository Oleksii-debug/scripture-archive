name: R06 Current Package Accessibility Settings Qualification

on:
  push:
    branches:
      - r06-qa-current-package-accessibility-settings-0913-sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility-settings:
    name: accessibility settings (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_PACKAGE_SHA: fa836d79fcfd9ac5d8aacbf6a6be9f5a10183012
      HELPER_WORKFLOW: .github/workflows/r06-current-package-accessibility-settings.yml
    steps:
      - name: Checkout helper evidence commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable package ancestry and workflow-only delta
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${EXPECTED_PACKAGE_SHA}^{commit}"
          test "$(git merge-base "${EXPECTED_PACKAGE_SHA}" HEAD)" = "${EXPECTED_PACKAGE_SHA}"
          mapfile -t changed < <(git diff --name-only "${EXPECTED_PACKAGE_SHA}"..HEAD)
          printf 'helper delta:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${HELPER_WORKFLOW}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile settings composition test
        working-directory: lanes/dev1/repair_overlay
        run: python -m py_compile tests/test_accessibility_settings_ui.py

      - name: Validate settings and startup-hook syntax
        working-directory: lanes/dev1/repair_overlay/frontend
        run: |
          node --check settings-ui.js
          node --check keymap-ui.js

      - name: Run exact packaged Accessibility Settings regression
        working-directory: lanes/dev1/repair_overlay
        run: python tests/test_accessibility_settings_ui.py -v

      - name: Diff hygiene
        shell: bash
        run: git diff --check
