name: DEV3 Closure03 Corpus Materialization

on:
  push:
    branches:
      - r06-dev3-gospels-finalprep-02
    paths:
      - lanes/dev3/finalprep_payload/payload.zip
      - lanes/dev3/finalprep_payload/READY
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dev3-finalprep-materialize.yml
      - lanes/dev3/finalprep_payload/**

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV3 branch
        uses: actions/checkout@v4
        with:
          ref: r06-dev3-gospels-finalprep-02
          fetch-depth: 0
      - name: Verify and materialize exact payload
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=lanes/dev3/finalprep_payload/payload.zip
          test -f "$PAYLOAD"
          echo 'b2da1210221b2f682a5e991df325e38403c170aafe51e2fbc9f152c3d35c47dd  lanes/dev3/finalprep_payload/payload.zip' | sha256sum -c -
          ROOT=docs/campaigns/GW/R06_DEV3_CLOSURE_03
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          unzip -q "$PAYLOAD" -d "$ROOT"
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('docs/campaigns/GW/R06_DEV3_CLOSURE_03')
          manifest=json.loads((root/'GW_GITHUB_MATERIALIZATION_MANIFEST_v1.2.json').read_text(encoding='utf-8'))
          node_files=sorted((root/'nodes').glob('*.json'))
          nodes=[]
          for p in node_files:
              nodes.extend(json.loads(p.read_text(encoding='utf-8'))['nodes'])
          assert len(node_files)==15, len(node_files)
          assert len(nodes)==360, len(nodes)
          assert len({n['node_id'] for n in nodes})==360
          assert sum(n['textual_variant_flag']=='TX1' for n in nodes)==22
          ev=json.loads((root/'evidence'/'GW_EVIDENCE_BOARD_EVIDENCE_v1.2.json').read_text(encoding='utf-8'))
          records=ev.get('entities') or ev.get('evidence') or ev.get('records') or []
          assert len(records)==240, len(records)
          sums={}
          for line in (root/'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              h, rel=line.split(None,1)
              rel=rel.strip().lstrip('*')
              b=(root/rel).read_bytes()
              got=hashlib.sha256(b).hexdigest()
              assert got==h, (rel,h,got)
              sums[rel]=got
          assert sums
          print('DEV3_CLOSURE_03_MATERIALIZATION_PASS nodes=360 evidence=240 tx1=22 hashed_files='+str(len(sums)))
          PY
          rm -rf lanes/dev3/finalprep_payload/chunk_*.b64 lanes/dev3/finalprep_payload/TEST_TRIGGER lanes/dev3/finalprep_payload/READY
      - name: Commit readable canonical corpus
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- lanes/dev3/finalprep_payload docs/campaigns/GW/R06_DEV3_CLOSURE_03
          if git diff --cached --quiet; then
            echo 'No materialization changes to commit.'
            exit 0
          fi
          git commit -m 'R06 DEV3 closure03: materialize readable Gospel corpus [skip ci]'
          git push origin HEAD:r06-dev3-gospels-finalprep-02
