name: DEV09 D4 exact readable materialization

on:
  push:
    branches: [ r06-swarm-dev09-ot-otnt ]
    paths:
      - '.github/workflows/dev09-d4-readable-materialize.yml'

permissions:
  contents: write

jobs:
  materialize-and-readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: r06-swarm-dev09-ot-otnt

      - name: Reassemble immutable D4 transport authority
        shell: python
        run: |
          import base64, glob, hashlib, pathlib, zipfile
          parts=sorted(glob.glob('lanes/dev4/finalprep_payload_parts/part_*.b64'))
          if not parts:
              raise SystemExit('D4 transport parts missing')
          raw=base64.b64decode(''.join(pathlib.Path(p).read_text(encoding='ascii').strip() for p in parts),validate=True)
          got=hashlib.sha256(raw).hexdigest()
          expected='e8b008c31462d7ed9388a7a84f73bb8666c8449181000751e9da45c2468779c9'
          print('transport_payload_bytes',len(raw),'sha256',got)
          if got!=expected:
              raise SystemExit(f'D4 transport SHA mismatch: {got}')
          zpath=pathlib.Path('/tmp/d4_transport.zip')
          zpath.write_bytes(raw)
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip()
              if bad:
                  raise SystemExit(f'D4 transport ZIP CRC failure: {bad}')
              z.extractall('/tmp/d4src')

      - name: Reproduce closure-approved H1 repair and prove 450 truth hashes
        shell: python
        run: |
          import json, hashlib, pathlib
          src=pathlib.Path('/tmp/d4src')
          campaign=src/'docs/campaigns/OT/R06_D4_OT_CANONICAL_v1.0'
          files=sorted(campaign.glob('nodes_part_*.json'))
          payloads=[json.loads(p.read_text(encoding='utf-8')) for p in files]
          nodes=[n for obj in payloads for n in obj['nodes']]
          if len(nodes)!=450:
              raise SystemExit(f'node count {len(nodes)} != 450')
          repairs=0
          for n in nodes:
              h1=n.get('hints',{}).get('H1')
              if isinstance(h1,str) and 'доказовий запис запис' in h1:
                  n['hints']['H1']=h1.replace('доказовий запис запис','доказовий запис')
                  repairs+=1
          if repairs!=63:
              raise SystemExit(f'closure-approved H1 repair count {repairs} != 63')
          def canon(o):
              return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')
          expected={}
          hash_root=pathlib.Path('docs/campaigns/OT/R06_D4_STAGE05_READABLE/record_hashes')
          for p in sorted(hash_root.glob('nodes_*.sha256.json')):
              expected.update(json.loads(p.read_text(encoding='utf-8')))
          got={n['node_id']:hashlib.sha256(canon(n)).hexdigest() for n in nodes}
          if set(got)!=set(expected):
              raise SystemExit(f'node ID set mismatch got={len(got)} expected={len(expected)}')
          bad=[k for k in sorted(got) if got[k]!=expected[k]]
          if bad:
              raise SystemExit(f'node hash mismatch count={len(bad)} first={bad[:5]}')
          agg=hashlib.sha256(''.join(got[k] for k in sorted(got)).encode('ascii')).hexdigest()
          expected_agg='ffb5fc49efaa42e4cd5b5a665f3b027a427a03498758b6622bb91649ea0dce5f'
          if agg!=expected_agg:
              raise SystemExit(f'node aggregate {agg} != {expected_agg}')
          # Preserve the already fetched-back legacy N001-N009 files; write only missing N010-N450.
          out=pathlib.Path('docs/campaigns/OT/R06_D4_STAGE05_READABLE/nodes')
          out.mkdir(parents=True,exist_ok=True)
          preserve={'nodes_001_002.jsonl','nodes_003_004.jsonl','nodes_005_007.jsonl','nodes_008_009.jsonl'}
          for p in out.glob('nodes_*.jsonl'):
              if p.name not in preserve:
                  p.unlink()
          tail=nodes[9:]
          chunk_size=30
          for off in range(0,len(tail),chunk_size):
              chunk=tail[off:off+chunk_size]
              start=10+off
              end=start+len(chunk)-1
              path=out/f'nodes_{start:03}_{end:03}.jsonl'
              path.write_text(''.join(canon(n).decode('utf-8')+'\n' for n in chunk),encoding='utf-8')
          print('D4_TRUTH_HASH_GATE_PASS nodes=450 H1_REPAIR=63 aggregate='+agg)

      - name: Validate complete readable materialization and support truth
        shell: python
        run: |
          import json, hashlib, pathlib, collections
          root=pathlib.Path('docs/campaigns/OT/R06_D4_STAGE05_READABLE')
          def canon(o):
              return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')
          expected={}
          for p in sorted((root/'record_hashes').glob('nodes_*.sha256.json')):
              expected.update(json.loads(p.read_text(encoding='utf-8')))
          nodes=[]
          for p in sorted((root/'nodes').glob('nodes_*.jsonl')):
              for line in p.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      nodes.append(json.loads(line))
          ids=[n['node_id'] for n in nodes]
          if len(nodes)!=450 or len(set(ids))!=450:
              raise SystemExit(f'readable node count/uniqueness failure {len(nodes)}/{len(set(ids))}')
          got={n['node_id']:hashlib.sha256(canon(n)).hexdigest() for n in nodes}
          bad=[k for k in sorted(expected) if got.get(k)!=expected[k]]
          extra=sorted(set(got)-set(expected))
          if bad or extra:
              raise SystemExit(f'readable hash failure bad={bad[:5]} extra={extra[:5]}')
          agg=hashlib.sha256(''.join(got[k] for k in sorted(got)).encode('ascii')).hexdigest()
          if agg!='ffb5fc49efaa42e4cd5b5a665f3b027a427a03498758b6622bb91649ea0dce5f':
              raise SystemExit('readable aggregate mismatch '+agg)
          task_counts=collections.Counter(n.get('task_type') for n in nodes)
          conf=collections.Counter(n.get('confidence_code') for n in nodes)
          otnt=[n for n in nodes if n.get('task_type')=='OT_NT_LINK']
          authored=sum(1 for n in otnt if isinstance(n.get('grading'),dict) and n['grading'].get('ot_nt_link'))
          if len(otnt)!=24 or authored!=24:
              raise SystemExit(f'OT_NT_LINK authored truth {authored}/{len(otnt)}')
          if conf.get('D1')!=6 or conf.get('I1')!=27:
              raise SystemExit(f'D1/I1 confidence regression {dict(conf)}')
          evidence_ids=set()
          for p in sorted((root/'evidence').glob('*.jsonl')):
              for line in p.read_text(encoding='utf-8').splitlines():
                  if line.strip(): evidence_ids.add(json.loads(line)['evidence_id'])
          missing=sorted({n.get('required_evidence') for n in nodes if n.get('required_evidence')} - evidence_ids)
          if missing:
              raise SystemExit(f'missing required evidence refs {missing[:10]}')
          relations=[]
          for p in sorted((root/'relations').glob('*.jsonl')):
              for line in p.read_text(encoding='utf-8').splitlines():
                  if line.strip(): relations.append(json.loads(line))
          if len(relations)!=24:
              raise SystemExit(f'relation count {len(relations)}')
          print('D4_READABLE_VALIDATION_PASS nodes=450 evidence=90 relations=24 OT_NT_LINK=24/24 D1=6 I1=27')
          print('task_types='+json.dumps(task_counts,sort_keys=True))

      - name: Run closure D4 source validators
        run: |
          cd /tmp/d4src
          python -m py_compile tools/validate_ot_r06_d4.py tools/test_ot_r06_d4_d5_contract.py
          python tools/validate_ot_r06_d4.py
          python tools/test_ot_r06_d4_d5_contract.py

      - name: Write deterministic DEV09 materialization manifest
        shell: python
        run: |
          import json, hashlib, pathlib
          root=pathlib.Path('docs/campaigns/OT/R06_D4_STAGE05_READABLE')
          files=[]
          for p in sorted((root/'nodes').glob('nodes_*.jsonl')):
              b=p.read_bytes()
              files.append({'path':str(p).replace('\\','/'),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={
            'schema':'DEV09_D4_READABLE_MATERIALIZATION_v1',
            'legacy_parent_head':'998087dfa52408d2c1a9ab067373a75e8d493764',
            'closure_package':'DEV_LANE_SCRIPTURE_R06_D4_CLOSURE_03.zip',
            'closure_drive_id':'1LSrCc1M8DcqRBwpO2NAVmcB9EzazgMDq',
            'closure_sha256':'c4e8dfe4ea62df2c3d52b810fb2413b31d6dcfd4cc711320beae3258ac6a981a',
            'transport_payload_sha256':'e8b008c31462d7ed9388a7a84f73bb8666c8449181000751e9da45c2468779c9',
            'canonical_serialization':'UTF-8 JSON ensure_ascii=false sort_keys=true separators=(comma,colon)',
            'counts':{'nodes':450,'evidence':90,'relations':24,'dossiers':15,'missions':15},
            'node_record_aggregate_sha256':'ffb5fc49efaa42e4cd5b5a665f3b027a427a03498758b6622bb91649ea0dce5f',
            'controlled_player_text_repair':{'field':'hints.H1','count':63,'ground_truth_fields_changed':0},
            'preserved_legacy_readback_records':'N001-N009',
            'newly_materialized_records':'N010-N450',
            'node_files':files
          }
          path=pathlib.Path('docs/workflow/r06_dev09/D4_READABLE_MATERIALIZATION_MANIFEST.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('DEV09_MANIFEST_PASS node_files',len(files))

      - name: Commit only DEV09-owned materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'scripture-archive-dev09-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/campaigns/OT/R06_D4_STAGE05_READABLE/nodes docs/workflow/r06_dev09/D4_READABLE_MATERIALIZATION_MANIFEST.json
          if git diff --cached --quiet; then
            echo 'No DEV09 D4 materialization delta.'
          else
            git commit -m 'R06 DEV09: complete exact readable D4 node materialization'
            git push origin HEAD:r06-swarm-dev09-ot-otnt
          fi
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Exact remote fetch-back and revalidation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/r06-swarm-dev09-ot-otnt:refs/remotes/origin/r06-swarm-dev09-ot-otnt
          remote_sha=$(git rev-parse refs/remotes/origin/r06-swarm-dev09-ot-otnt)
          echo "remote_sha=$remote_sha pushed_sha=$pushed_sha"
          test "$remote_sha" = "$pushed_sha"
          rm -rf /tmp/dev09-readback
          git worktree add --detach /tmp/dev09-readback "$remote_sha"
          python - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('/tmp/dev09-readback/docs/campaigns/OT/R06_D4_STAGE05_READABLE')
          def canon(o): return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')
          expected={}
          for p in sorted((root/'record_hashes').glob('nodes_*.sha256.json')): expected.update(json.loads(p.read_text(encoding='utf-8')))
          nodes=[]
          for p in sorted((root/'nodes').glob('nodes_*.jsonl')):
              nodes.extend(json.loads(line) for line in p.read_text(encoding='utf-8').splitlines() if line.strip())
          got={n['node_id']:hashlib.sha256(canon(n)).hexdigest() for n in nodes}
          if len(nodes)!=450 or len(got)!=450 or got!=expected: raise SystemExit('REMOTE_FETCHBACK_RECORD_HASH_FAIL')
          agg=hashlib.sha256(''.join(got[k] for k in sorted(got)).encode('ascii')).hexdigest()
          if agg!='ffb5fc49efaa42e4cd5b5a665f3b027a427a03498758b6622bb91649ea0dce5f': raise SystemExit('REMOTE_FETCHBACK_AGG_FAIL '+agg)
          manifest=json.loads(pathlib.Path('/tmp/dev09-readback/docs/workflow/r06_dev09/D4_READABLE_MATERIALIZATION_MANIFEST.json').read_text(encoding='utf-8'))
          for item in manifest['node_files']:
              p=pathlib.Path('/tmp/dev09-readback')/item['path']; b=p.read_bytes()
              if len(b)!=item['bytes'] or hashlib.sha256(b).hexdigest()!=item['sha256']: raise SystemExit('REMOTE_FETCHBACK_FILE_FAIL '+item['path'])
          print('D4_REMOTE_FETCHBACK_PASS nodes=450 files='+str(len(manifest['node_files']))+' aggregate='+agg)
          PY
