name: R06 DEV1 Platform CI

on:
  workflow_dispatch:
  push:
    branches:
      - r06-dev1-platform-windows-constructor
      - r06-swarm-dev01-windows-release
    paths:
      - 'lanes/dev1/**'
      - 'runtime_engine/**'
      - '.github/workflows/r06-dev1-platform.yml'
  pull_request:
    paths:
      - 'lanes/dev1/**'
      - 'runtime_engine/**'
      - '.github/workflows/r06-dev1-platform.yml'

jobs:
  linux-contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct immutable DEV1 base source
        shell: bash
        run: |
          cat lanes/dev1/source_parts/part-*.b64 | base64 -d > DEV1_R06_PLATFORM_SOURCE.zip
          echo "51a31a8840b57850c8d4d0fc714b124445f3b3155daea083817c3570e0b80e0e  DEV1_R06_PLATFORM_SOURCE.zip" | sha256sum -c -
          python -m zipfile -e DEV1_R06_PLATFORM_SOURCE.zip .
      - name: Apply readable pre-integration repair overlay
        shell: bash
        run: cp -R lanes/dev1/repair_overlay/. r06_platform/
      - name: Compile and test repaired source
        shell: bash
        run: |
          python -m compileall -q r06_platform/scripture_archive_platform r06_platform/tests r06_platform/packaging
          (cd r06_platform && python -m unittest discover -s tests -v)
          node --check r06_platform/frontend/renderers.js
          python r06_platform/tools_smoke.py
          python r06_platform/packaging/windows_release.py diagnose \
            --platform-root r06_platform \
            --output r06_platform/diagnostics-linux.json
      - name: Archive repaired readable source
        shell: bash
        run: python -c "import shutil; shutil.make_archive('DEV1_R06_PLATFORM_SOURCE_REPAIRED','zip','.', 'r06_platform')"
      - uses: actions/upload-artifact@v4
        with:
          name: DEV1-R06-Repaired-Readable-Source
          path: |
            DEV1_R06_PLATFORM_SOURCE_REPAIRED.zip
            r06_platform/diagnostics-linux.json
          if-no-files-found: error

  windows-build-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct immutable DEV1 base source
        shell: pwsh
        run: |
          $parts = Get-ChildItem lanes/dev1/source_parts/part-*.b64 | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('DEV1_R06_PLATFORM_SOURCE.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash DEV1_R06_PLATFORM_SOURCE.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '51a31a8840b57850c8d4d0fc714b124445f3b3155daea083817c3570e0b80e0e') { throw "Base source archive hash mismatch: $hash" }
          Expand-Archive DEV1_R06_PLATFORM_SOURCE.zip -DestinationPath . -Force
      - name: Apply readable pre-integration repair overlay
        shell: pwsh
        run: Copy-Item -Path lanes\dev1\repair_overlay\* -Destination r06_platform -Recurse -Force
      - name: Compile and test repaired source on Windows
        shell: pwsh
        run: |
          python -m compileall -q r06_platform\scripture_archive_platform r06_platform\tests r06_platform\packaging
          Push-Location r06_platform
          python -m unittest discover -s tests -v
          Pop-Location
          node --check r06_platform\frontend\renderers.js
          python r06_platform\tools_smoke.py
      - name: Build Windows developer artifact
        shell: pwsh
        run: ./r06_platform/packaging/build_windows.ps1
      - name: Probe packaged process liveness
        shell: pwsh
        run: |
          ./r06_platform/packaging/probe_packaged_startup.ps1 `
            -Executable ./r06_platform/dist/ScriptureArchive-R06-DEV01.exe `
            -ProbeSeconds 8 `
            -OutputJson ./r06_platform/dist/packaged_startup_probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: ScriptureArchive-R06-DEV01-Windows
          path: r06_platform/dist/**
          if-no-files-found: error
