name: R06 Constructor V2 Direct Qualification

on:
  pull_request:
    paths:
      - 'lanes/dev1/repair_overlay/frontend/constructor-v2-ui.js'
      - 'lanes/dev1/repair_overlay/frontend/transport.js'
      - 'lanes/dev1/repair_overlay/scripture_archive_platform/application/service.py'
      - 'lanes/dev1/repair_overlay/scripture_archive_platform/authoring/**'
      - 'lanes/dev1/repair_overlay/scripture_archive_platform/transport/contracts.py'
      - 'lanes/dev1/repair_overlay/tests/test_authoring_transport.py'
      - 'lanes/dev1/repair_overlay/tests/test_constructor_v2_frontend.py'
      - 'lanes/dev1/repair_overlay/tests/test_constructor_v2_lifecycle.py'
      - 'lanes/dev1/repair_overlay/tests/test_constructor_v2_recovery_atomicity.py'
      - '.github/workflows/r06-constructor-v2-direct-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r06-constructor-v2-direct-${{ github.ref }}
  cancel-in-progress: true

jobs:
  constructor-v2-direct-overlay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pathsep: ':'
          - os: windows-latest
            pathsep: ';'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: "${{ github.workspace }}/r06_platform${{ matrix.pathsep }}${{ github.workspace }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Reconstruct verified Constructor dependency substrate and apply overlay
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, shutil, zipfile
          from pathlib import Path, PurePosixPath

          parts = sorted(Path('lanes/dev1/source_parts').glob('part-*.b64'))
          if not parts:
              raise SystemExit('missing DEV1 source parts')
          encoded = ''.join(path.read_text(encoding='ascii') for path in parts)
          archive_bytes = base64.b64decode(encoded)
          archive = Path('DEV1_R06_PLATFORM_SOURCE_CONSTRUCTOR_SUBSTRATE.zip')
          archive.write_bytes(archive_bytes)
          print('exact-head source-parts sha256=', hashlib.sha256(archive_bytes).hexdigest())

          # Shared DEV1 release qualification owns whole-archive fidelity (#146).
          # Constructor qualification needs only the Python platform dependency
          # subtree. Verify CRC while extracting every member of that subtree and
          # fail closed on any corruption there; do not treat unrelated corrupt
          # frontend members as Constructor evidence or as a release-gate pass.
          prefix = PurePosixPath('r06_platform/scripture_archive_platform')
          extracted = 0
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  member = PurePosixPath(info.filename)
                  if member == prefix or prefix in member.parents:
                      try:
                          zf.extract(info, '.')
                      except (zipfile.BadZipFile, OSError) as exc:
                          raise SystemExit(f'corrupt Constructor dependency member {info.filename}: {exc}') from exc
                      extracted += 1
          if extracted == 0:
              raise SystemExit('DEV1 source parts contain no Constructor dependency subtree')

          root = Path('r06_platform')
          required = [
              root / 'scripture_archive_platform' / 'persistence' / 'store.py',
              root / 'scripture_archive_platform' / 'content' / 'loader.py',
              root / 'scripture_archive_platform' / 'domain' / 'registries.py',
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Constructor dependency substrate missing: ' + ', '.join(missing))
          shutil.copytree('lanes/dev1/repair_overlay', root, dirs_exist_ok=True)
          PY
      - name: Compile composed Constructor V2 surface
        run: >-
          python -m compileall -q
          r06_platform/scripture_archive_platform/authoring
          r06_platform/scripture_archive_platform/application/service.py
          r06_platform/scripture_archive_platform/transport/contracts.py
          r06_platform/tests/test_constructor_v2_lifecycle.py
          r06_platform/tests/test_constructor_v2_recovery_atomicity.py
          r06_platform/tests/test_authoring_transport.py
      - name: Run Constructor V2 lifecycle regression
        run: python r06_platform/tests/test_constructor_v2_lifecycle.py
      - name: Run Constructor V2 crash-recovery regression
        run: python r06_platform/tests/test_constructor_v2_recovery_atomicity.py
      - name: Run Constructor V2 allowlist and source-isolation regression
        run: python r06_platform/tests/test_authoring_transport.py
      - name: Run Constructor V2 semantic frontend regression
        run: python r06_platform/tests/test_constructor_v2_frontend.py
      - name: Verify Constructor V2 frontend module syntax
        run: node --check r06_platform/frontend/constructor-v2-ui.js
      - name: Diff hygiene
        shell: bash
        run: git diff --check
