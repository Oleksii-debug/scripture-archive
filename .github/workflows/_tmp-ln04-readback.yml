name: TEMP LN04 exact pedagogical repair

on:
  push:
    branches:
      - r06-pedagogy-ln04-hints-0912-sol

permissions:
  contents: write

jobs:
  repair-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Bind exact immutable trigger and remote parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          REMOTE_SHA="$(git ls-remote origin refs/heads/r06-pedagogy-ln04-hints-0912-sol | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
      - name: Apply deterministic hints-only repair
        shell: bash
        run: |
          set -euo pipefail
          python tools/_tmp_repair_ln04_hints.py
      - name: Prove only hints changed in LN04 JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('docs/campaigns/LN/LN-04_CANONICAL_v1.2')
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          changed=0
          for path in sorted(root.glob('nodes_part_*.json')):
              rel=path.as_posix()
              old=json.loads(subprocess.check_output(['git','show',f'{head}:{rel}'],text=True))
              new=json.loads(path.read_text(encoding='utf-8'))
              assert old.keys()==new.keys(), rel
              assert len(old['nodes'])==len(new['nodes']), rel
              for before,after in zip(old['nodes'],new['nodes']):
                  assert before['node_id']==after['node_id']
                  b=dict(before); a=dict(after)
                  bh=b.pop('hints',None); ah=a.pop('hints',None)
                  assert b==a, f'non-hints drift: {before["node_id"]}'
                  if bh != ah:
                      changed += 1
                      assert set(ah)=={f'H{i}' for i in range(1,8)}
                      assert all(isinstance(v,str) and v.strip() and v.strip()!='not_used' for v in ah.values())
          assert changed==15, changed
          print('INVARIANT PASS: exactly 15 nodes changed, hints only')
          PY
      - name: Run pedagogical quality gate on repaired LN04
        shell: bash
        run: |
          set -euo pipefail
          python tools/analyze_pedagogical_quality.py docs/campaigns/LN/LN-04_CANONICAL_v1.2 --json-out /tmp/ln04-pedagogy.json --markdown-out /tmp/ln04-pedagogy.md --fail-on blocker
          python - <<'PY'
          import json
          r=json.load(open('/tmp/ln04-pedagogy.json',encoding='utf-8'))
          assert r['nodes_analyzed']==15, r['nodes_analyzed']
          assert r['finding_counts']['BLOCKER']==0, r['finding_counts']
          assert r['finding_counts']['WARN']==0, r['finding_counts']
          print('PEDAGOGY PASS: 15 nodes, 0 BLOCKER, 0 WARN')
          PY
      - name: Validate JSON and canonical schema fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path('docs/campaigns/LN/LN-04_CANONICAL_v1.2').glob('nodes_part_*.json')):
              d=json.loads(p.read_text(encoding='utf-8'))
              assert d['schema_version']=='CONTENT_NODE_SCHEMA_v1.2'
              assert d['mission_id']=='LN-04'
              assert d['canonical_status']=='AUTHOR_COMPLETE / DEVELOPER_SOURCE_AUDITED / INDEPENDENT_AUDIT_PENDING'
          print('JSON/STATUS PASS')
          PY
      - name: Remove temporary authoring machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_tmp-ln04-readback.yml tools/_tmp_repair_ln04_hints.py
      - name: Commit clean four-file canonical repair and push fail-closed
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=(
            docs/campaigns/LN/LN-04_CANONICAL_v1.2/nodes_part_01.json
            docs/campaigns/LN/LN-04_CANONICAL_v1.2/nodes_part_02.json
            docs/campaigns/LN/LN-04_CANONICAL_v1.2/nodes_part_03.json
            docs/campaigns/LN/LN-04_CANONICAL_v1.2/nodes_part_04.json
            .github/workflows/_tmp-ln04-readback.yml
            tools/_tmp_repair_ln04_hints.py
          )
          mapfile -t ACTUAL < <(git diff HEAD --name-only | sort)
          mapfile -t WANT < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          diff -u <(printf '%s\n' "${WANT[@]}") <(printf '%s\n' "${ACTUAL[@]}")
          REMOTE_SHA="$(git ls-remote origin refs/heads/r06-pedagogy-ln04-hints-0912-sol | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git config user.name 'scripture-archive-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/campaigns/LN/LN-04_CANONICAL_v1.2/nodes_part_01.json \
                  docs/campaigns/LN/LN-04_CANONICAL_v1.2/nodes_part_02.json \
                  docs/campaigns/LN/LN-04_CANONICAL_v1.2/nodes_part_03.json \
                  docs/campaigns/LN/LN-04_CANONICAL_v1.2/nodes_part_04.json
          git commit -m 'R06 pedagogy: repair LN04 progressive hint ladders'
          git push origin HEAD:refs/heads/r06-pedagogy-ln04-hints-0912-sol
