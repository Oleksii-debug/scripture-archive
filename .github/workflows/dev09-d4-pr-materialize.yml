name: DEV09 D4 PR exact materialization

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/dev09-d4-pr-materialize.yml'
      - 'tools/dev09_materialize_d4_readable.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: r06-swarm-dev09-ot-otnt

      - name: Compile and materialize exact closed D4 records
        run: |
          python -m py_compile tools/dev09_materialize_d4_readable.py
          python tools/dev09_materialize_d4_readable.py --chunk-size 30

      - name: Commit only DEV09-owned readable materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'scripture-archive-dev09-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/campaigns/OT/R06_D4_STAGE05_READABLE/nodes docs/workflow/r06_dev09/D4_READABLE_MATERIALIZATION_MANIFEST.json
          if git diff --cached --quiet; then
            echo 'No DEV09 materialization delta.'
          else
            git commit -m 'R06 DEV09: complete exact readable D4 node materialization'
            git push origin HEAD:r06-swarm-dev09-ot-otnt
          fi
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Exact remote Git fetch-back
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/r06-swarm-dev09-ot-otnt:refs/remotes/origin/r06-swarm-dev09-ot-otnt
          remote_sha=$(git rev-parse refs/remotes/origin/r06-swarm-dev09-ot-otnt)
          echo "remote_sha=$remote_sha pushed_sha=$pushed_sha"
          test "$remote_sha" = "$pushed_sha"
          rm -rf /tmp/dev09-readback
          git worktree add --detach /tmp/dev09-readback "$remote_sha"
          python /tmp/dev09-readback/tools/dev09_materialize_d4_readable.py --root /tmp/dev09-readback --verify-only --require-manifest
          echo "D4_REMOTE_FETCHBACK_PASS $remote_sha"
