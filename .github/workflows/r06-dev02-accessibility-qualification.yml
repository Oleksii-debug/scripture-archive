name: R06 DEV02 Accessibility Qualification

on:
  pull_request:
    paths:
      - 'lanes/dev1/repair_overlay/frontend/app.js'
      - 'lanes/dev1/repair_overlay/frontend/hotkeys.js'
      - 'lanes/dev1/repair_overlay/frontend/keymap-ui.js'
      - 'lanes/dev1/repair_overlay/frontend/renderers-base.js'
      - 'lanes/dev1/repair_overlay/frontend/renderers.js'
      - 'lanes/dev1/repair_overlay/frontend/accessibility-inspector-ui.js'
      - 'lanes/dev1/repair_overlay/scripture_archive_platform/accessibility/semantics.py'
      - 'lanes/dev1/repair_overlay/tests/test_accessibility.py'
      - 'lanes/dev1/repair_overlay/tests/test_packaged_accessibility_inspector_surface.py'
      - '.github/workflows/r06-dev02-accessibility-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Compile accessibility Python contracts
        working-directory: lanes/dev1/repair_overlay
        run: python -m py_compile scripture_archive_platform/accessibility/semantics.py tests/test_accessibility.py tests/test_packaged_accessibility_inspector_surface.py
      - name: Check changed accessibility ES modules
        working-directory: lanes/dev1/repair_overlay
        shell: bash
        run: |
          node --check frontend/app.js
          node --check frontend/hotkeys.js
          node --check frontend/keymap-ui.js
          node --check frontend/renderers-base.js
          node --check frontend/renderers.js
          node --check frontend/accessibility-inspector-ui.js
      - name: Run exact accessibility regression
        working-directory: lanes/dev1/repair_overlay
        run: python -m unittest discover -s tests -p "test_accessibility.py" -v
      - name: Run packaged Accessibility Inspector surface regression
        working-directory: lanes/dev1/repair_overlay
        run: python -m unittest discover -s tests -p "test_packaged_accessibility_inspector_surface.py" -v
      - name: Diff hygiene
        shell: bash
        run: git diff --check
