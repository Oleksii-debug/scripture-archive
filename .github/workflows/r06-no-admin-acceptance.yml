name: R06 No-Admin Packaged Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - r06-gospel-no-admin-acceptance-0927-sol
    paths:
      - 'lanes/dev1/repair_overlay/packaging/run_no_admin_acceptance.ps1'
      - 'lanes/dev1/repair_overlay/packaging/probe_packaged_startup.ps1'
      - 'lanes/dev1/repair_overlay/tests/test_no_admin_acceptance_contract.py'
      - '.github/workflows/r06-no-admin-acceptance.yml'
  pull_request:
    paths:
      - 'lanes/dev1/repair_overlay/packaging/run_no_admin_acceptance.ps1'
      - 'lanes/dev1/repair_overlay/packaging/probe_packaged_startup.ps1'
      - 'lanes/dev1/repair_overlay/tests/test_no_admin_acceptance_contract.py'
      - '.github/workflows/r06-no-admin-acceptance.yml'

env:
  DEV01_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DEV01_BASE_SOURCE_SHA256: 10fbd546ff4d985465b85b99f4f64bff95d9ec8b1f27132c6d21b4930c344c35
  PYTHONUTF8: '1'

jobs:
  no-admin-packaged-acceptance:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEV01_SOURCE_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Confirm exact source checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:DEV01_SOURCE_SHA) { throw "Expected $env:DEV01_SOURCE_SHA, got $actual" }

      - name: Reconstruct and verify canonical FINALPREP02 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem release_inputs/dev1_finalprep02/part-*.b64 | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('DEV1_R06_PLATFORM_SOURCE.zip', [Convert]::FromBase64String($b64))
          python lanes\dev1\verify_source_archive.py DEV1_R06_PLATFORM_SOURCE.zip $env:DEV01_BASE_SOURCE_SHA256
          if ($LASTEXITCODE -ne 0) { throw "DEV1 source archive verification failed with exit code $LASTEXITCODE" }
          Expand-Archive DEV1_R06_PLATFORM_SOURCE.zip -DestinationPath . -Force
          if (-not (Test-Path r06_platform -PathType Container)) { throw "Verified archive did not extract r06_platform" }
          Copy-Item -Path lanes\dev1\repair_overlay\* -Destination r06_platform -Recurse -Force

      - name: Run no-admin contract regressions
        shell: pwsh
        run: |
          python -m unittest discover -s lanes\dev1\repair_overlay\tests -p test_no_admin_acceptance_contract.py -v
          if ($LASTEXITCODE -ne 0) { throw "No-admin contract regressions failed with exit code $LASTEXITCODE" }

      - name: Build exact packaged executable
        shell: pwsh
        run: |
          ./r06_platform/packaging/build_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Packaged build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path r06_platform/dist/ScriptureArchive-R06-DEV01.exe -PathType Leaf)) {
            throw "Expected packaged executable was not produced"
          }

      - name: Prove harness fails closed under the admin runner token
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path r06_platform/dist/ScriptureArchive-R06-DEV01.exe).Path
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $resultPath = (Join-Path (Resolve-Path r06_platform/dist).Path "no_admin_admin_negative.json")
          $harness = (Resolve-Path r06_platform/packaging/run_no_admin_acceptance.ps1).Path
          $arguments = @(
            "-NoLogo",
            "-NoProfile",
            "-NonInteractive",
            "-ExecutionPolicy", "Bypass",
            "-File", ('"' + $harness + '"'),
            "-Executable", ('"' + $exe + '"'),
            "-ExpectedSha256", $hash,
            "-ProbeSeconds", "1",
            "-OutputJson", ('"' + $resultPath + '"')
          )
          $powershell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $negative = Start-Process -FilePath $powershell -ArgumentList $arguments -Wait -PassThru
          if ($negative.ExitCode -ne 2) { throw "Admin negative control returned unexpected exit code $($negative.ExitCode)" }
          $result = Get-Content -Raw -Encoding utf8 -LiteralPath $resultPath | ConvertFrom-Json
          if ($result.status -ne "NO_ADMIN_ACCEPTANCE_FAIL") { throw "Admin negative control did not fail closed" }
          if ($result.is_admin -ne $true) { throw "Admin negative control did not record is_admin=true" }
          if ($result.failure -notlike "Standard-user token required*") { throw "Admin negative control failed for the wrong reason: $($result.failure)" }
          Write-Output "NO_ADMIN_ADMIN_NEGATIVE_CONTROL_PASS"

      - name: Execute packaged acceptance as ephemeral standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $user = "ScriptureNoAdmin"
          $publicRoot = Join-Path $env:PUBLIC "ScriptureArchive-NoAdmin"
          $resultPath = Join-Path $publicRoot "no_admin_acceptance.json"
          $childLog = Join-Path $publicRoot "child-output.log"
          $childError = Join-Path $publicRoot "child-error.log"
          $password = [guid]::NewGuid().ToString("N") + "!Aa7"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential(".\$user", $secure)

          try {
            if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name $user
            }
            New-LocalUser -Name $user -Password $secure -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
            $administrators = Get-LocalGroup -SID "S-1-5-32-544"
            $isAdminMember = @(Get-LocalGroupMember -Group $administrators.Name -ErrorAction Stop | Where-Object {
              $_.Name -eq "$env:COMPUTERNAME\$user" -or $_.Name -eq ".\$user"
            }).Count -gt 0
            if ($isAdminMember) {
              throw "Standard-user account unexpectedly belongs to the Administrators group"
            }

            New-Item -ItemType Directory -Force -Path $publicRoot | Out-Null
            $acl = Get-Acl -LiteralPath $publicRoot
            $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
              "$env:COMPUTERNAME\$user",
              "Modify",
              "ContainerInherit,ObjectInherit",
              "None",
              "Allow"
            )
            $acl.SetAccessRule($rule)
            Set-Acl -LiteralPath $publicRoot -AclObject $acl

            $buildExe = (Resolve-Path r06_platform/dist/ScriptureArchive-R06-DEV01.exe).Path
            $hash = (Get-FileHash -LiteralPath $buildExe -Algorithm SHA256).Hash.ToLowerInvariant()
            $exe = Join-Path $publicRoot "ScriptureArchive-R06-DEV01.exe"
            $harness = Join-Path $publicRoot "run_no_admin_acceptance.ps1"
            $startupProbe = Join-Path $publicRoot "probe_packaged_startup.ps1"
            Copy-Item -LiteralPath $buildExe -Destination $exe -Force
            Copy-Item r06_platform/packaging/run_no_admin_acceptance.ps1 $harness -Force
            Copy-Item r06_platform/packaging/probe_packaged_startup.ps1 $startupProbe -Force
            $publicHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($publicHash -ne $hash) { throw "Public staging copy does not match the exact build artifact SHA-256" }

            $arguments = @(
              "-NoLogo",
              "-NoProfile",
              "-NonInteractive",
              "-ExecutionPolicy", "Bypass",
              "-File", ('"' + $harness + '"'),
              "-Executable", ('"' + $exe + '"'),
              "-ExpectedSha256", $hash,
              "-ProbeSeconds", "8",
              "-OutputJson", ('"' + $resultPath + '"'),
              "-StartupProbeScript", ('"' + $startupProbe + '"')
            )
            $powershell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
            $child = Start-Process -FilePath $powershell -ArgumentList $arguments -Credential $credential -LoadUserProfile -WorkingDirectory $publicRoot -RedirectStandardOutput $childLog -RedirectStandardError $childError -PassThru
            if (-not $child.WaitForExit(120000)) {
              Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue
              throw "Standard-user acceptance process exceeded the 120-second bound"
            }
            $child.Refresh()

            if ($child.ExitCode -ne 0) {
              if (Test-Path $childLog) { Get-Content $childLog }
              if (Test-Path $childError) { Get-Content $childError }
              throw "Standard-user acceptance process failed with exit code $($child.ExitCode)"
            }
            if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
              throw "Standard-user acceptance did not emit result JSON"
            }
            $result = Get-Content -Raw -Encoding utf8 -LiteralPath $resultPath | ConvertFrom-Json
            if ($result.status -ne "NO_ADMIN_ACCEPTANCE_PASS") { throw "No-admin result status was $($result.status)" }
            if ($result.is_admin -ne $false) { throw "Child acceptance token was not standard-user" }
            if (-not $result.identity_name -or -not $result.user_sid) { throw "Standard-user identity evidence is incomplete" }
            if (-not $result.profile_sid_bound) { throw "Per-user state root was not bound to the child SID profile" }
            if ($result.local_app_data_source -ne "HKLM_ProfileList_current_sid") { throw "Unexpected per-user state authority: $($result.local_app_data_source)" }
            if (-not $result.per_user_state_writable) { throw "Per-user state write/readback was not proven" }
            if (-not $result.webview2_detected) { throw "WebView2 was not detected in standard-user context" }
            if (-not $result.unicode_spaced_path) { throw "Unicode + spaced per-user launch path was not proven" }
            if (-not $result.process_started) { throw "Packaged process did not start under standard-user token" }
            if (-not $result.survived_probe_window) { throw "Packaged process did not survive the standard-user probe window" }
            if ($result.source_sha256 -ne $hash -or $result.copied_sha256 -ne $hash) { throw "No-admin evidence SHA-256 does not match the exact build artifact" }
            Write-Output "NO_ADMIN_ACCEPTANCE_PASS user=$user sha256=$($result.source_sha256)"
          }
          finally {
            if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name $user
            }
          }

      - name: Collect no-admin evidence inside workspace
        if: always()
        shell: pwsh
        run: |
          $destination = Join-Path $PWD "no_admin_evidence"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $sources = @(
            @{ Path = "C:\Users\Public\ScriptureArchive-NoAdmin\no_admin_acceptance.json"; Name = "no_admin_acceptance.json" },
            @{ Path = "C:\Users\Public\ScriptureArchive-NoAdmin\child-output.log"; Name = "child-output.log" },
            @{ Path = "C:\Users\Public\ScriptureArchive-NoAdmin\child-error.log"; Name = "child-error.log" },
            @{ Path = (Join-Path $PWD "r06_platform\dist\no_admin_admin_negative.json"); Name = "no_admin_admin_negative.json" }
          )
          foreach ($source in $sources) {
            if (Test-Path -LiteralPath $source.Path -PathType Leaf) {
              Copy-Item -LiteralPath $source.Path -Destination (Join-Path $destination $source.Name) -Force
            }
          }
          Get-ChildItem -LiteralPath $destination -File -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output ("NO_ADMIN_EVIDENCE_STAGED " + $_.Name)
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R06-no-admin-packaged-acceptance
          path: no_admin_evidence
          if-no-files-found: warn
