name: DEV-C Stage05 D4 Readable Materialization

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/devc-stage05-d4-materialize.yml'
      - 'docs/campaigns/OT/R06_D4_STAGE05_READABLE/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: r06-3dev-c-d4-materialization-05

      - name: Reassemble immutable pre-repair transport payload
        shell: python
        run: |
          import base64, glob, hashlib, pathlib, zipfile
          parts=sorted(glob.glob('lanes/dev4/finalprep_payload_parts/part_*.b64'))
          if not parts:
              raise SystemExit('D4 transport parts missing')
          encoded=''.join(pathlib.Path(p).read_text(encoding='ascii').strip() for p in parts)
          raw=base64.b64decode(encoded, validate=True)
          expected='e8b008c31462d7ed9388a7a84f73bb8666c8449181000751e9da45c2468779c9'
          got=hashlib.sha256(raw).hexdigest()
          print('parts',len(parts),'bytes',len(raw),'sha256',got)
          if got!=expected:
              raise SystemExit(f'payload SHA mismatch {got}')
          out=pathlib.Path('/tmp/d4_pre_repair.zip'); out.write_bytes(raw)
          with zipfile.ZipFile(out) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f'ZIP CRC failure {bad}')
              z.extractall('/tmp/d4src')

      - name: Apply exact audited H1 repair and verify 450 canonical hashes
        shell: python
        run: |
          import json, hashlib, pathlib, shutil
          src=pathlib.Path('/tmp/d4src')
          campaign=src/'docs/campaigns/OT/R06_D4_OT_CANONICAL_v1.0'
          node_files=sorted(campaign.glob('nodes_part_*.json'))
          nodes=[]
          for p in node_files:
              nodes.extend(json.loads(p.read_text(encoding='utf-8'))['nodes'])
          if len(nodes)!=450: raise SystemExit(f'node count {len(nodes)}')
          repairs=0
          for n in nodes:
              h1=n.get('hints',{}).get('H1')
              if isinstance(h1,str) and 'доказовий запис запис' in h1:
                  n['hints']['H1']=h1.replace('доказовий запис запис','доказовий запис')
                  repairs += 1
          if repairs!=63: raise SystemExit(f'H1 repair count {repairs}, expected 63')
          def canon(o): return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')
          expected={}
          for p in sorted(pathlib.Path('docs/campaigns/OT/R06_D4_STAGE05_READABLE/record_hashes').glob('nodes_*.sha256.json')):
              expected.update(json.loads(p.read_text(encoding='utf-8')))
          got={n['node_id']:hashlib.sha256(canon(n)).hexdigest() for n in nodes}
          if set(got)!=set(expected):
              raise SystemExit(f'node ID set mismatch got={len(got)} expected={len(expected)}')
          bad=[k for k in sorted(got) if got[k]!=expected[k]]
          if bad: raise SystemExit(f'node record hash mismatch count={len(bad)} first={bad[:5]}')
          agg=hashlib.sha256(''.join(got[k] for k in sorted(got)).encode()).hexdigest()
          if agg!='ffb5fc49efaa42e4cd5b5a665f3b027a427a03498758b6622bb91649ea0dce5f':
              raise SystemExit(f'node aggregate mismatch {agg}')
          out=pathlib.Path('docs/campaigns/OT/R06_D4_STAGE05_CANONICAL')
          shutil.rmtree(out,ignore_errors=True)
          (out/'nodes').mkdir(parents=True)
          for i in range(0,len(nodes),15):
              chunk=nodes[i:i+15]
              text=''.join(canon(n).decode('utf-8')+'\n' for n in chunk)
              (out/'nodes'/f'nodes_{i+1:03}_{i+len(chunk):03}.jsonl').write_text(text,encoding='utf-8')
          print('D4_NODE_HASH_GATE_PASS 450/450 repairs=63 aggregate='+agg)

      - name: Materialize supporting canonical registries and validate collections
        shell: python
        run: |
          import json, hashlib, pathlib, shutil
          src=pathlib.Path('/tmp/d4src'); out=pathlib.Path('docs/campaigns/OT/R06_D4_STAGE05_CANONICAL')
          def canon(o): return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')
          def agg(records,idkey):
              h={r[idkey]:hashlib.sha256(canon(r)).hexdigest() for r in records}
              return hashlib.sha256(''.join(h[k] for k in sorted(h)).encode()).hexdigest(),h
          evidence_src=src/'docs/evidence/OT_R06_D4_EVIDENCE_REGISTRY_v1.0.json'
          relation_src=src/'docs/corpus/OTNT_RELATION_REGISTRY_R06_D4_v1.0.json'
          dossier_src=src/'docs/corpus/OT_R06_D4_CHARACTER_DOSSIERS_v1.0.json'
          entity_src=src/'docs/corpus/OT_R06_D4_ENTITY_REGISTRIES_v1.0.json'
          mission_src=src/'docs/campaigns/OT/R06_D4_OT_CANONICAL_v1.0/MISSION_INDEX.json'
          E=json.loads(evidence_src.read_text(encoding='utf-8')); R=json.loads(relation_src.read_text(encoding='utf-8')); D=json.loads(dossier_src.read_text(encoding='utf-8')); M=json.loads(mission_src.read_text(encoding='utf-8')); X=json.loads(entity_src.read_text(encoding='utf-8'))
          checks=[('evidence',E['evidence_records'],'evidence_id','4af76256bc75a030c6aff917dbfe80120ac6d3a98e327677ff613534006b279e'),('relations',R['relations'],'relation_id','f1d9a8faece1e7533d4cb4f1fdc0fdabd7e275f80b9dcb5bd43bd3e447efd17f'),('dossiers',D['dossiers'],'dossier_id','24083043fcef08d8b670a9a3908658468b2c9dfed8792cfb58f54967c9da0b86'),('missions',M['missions'],'mission_id','352006fcc55f13f7927284c20c67ad608c7cc5450f94598eff722d3c7ee46f02')]
          hashes={}
          for name,recs,key,expected in checks:
              a,h=agg(recs,key); hashes[name]=h
              if a!=expected: raise SystemExit(f'{name} aggregate mismatch {a}')
          if [len(E['evidence_records']),len(R['relations']),len(D['dossiers']),len(M['missions'])] != [90,24,15,15]: raise SystemExit('support count mismatch')
          (out/'registries').mkdir(parents=True,exist_ok=True); (out/'contracts').mkdir(exist_ok=True); (out/'record_hashes').mkdir(exist_ok=True)
          shutil.copy2(evidence_src,out/'registries/evidence_registry.json'); shutil.copy2(relation_src,out/'registries/otnt_relation_registry.json'); shutil.copy2(dossier_src,out/'registries/character_dossiers.json'); shutil.copy2(entity_src,out/'registries/entity_registries.json'); shutil.copy2(mission_src,out/'registries/mission_index.json')
          shutil.copy2(src/'docs/spec/R06_D4_SHARED_ANSWER_DTO_CONTRACT_v1.0.json',out/'contracts/R06_D4_SHARED_ANSWER_DTO_CONTRACT_v1.0.json'); shutil.copy2(src/'docs/spec/R06_D4_SHARED_ANSWER_DTO_CONTRACT_v1.0.md',out/'contracts/R06_D4_SHARED_ANSWER_DTO_CONTRACT_v1.0.md')
          for name,h in hashes.items(): (out/'record_hashes'/f'{name}.sha256.json').write_text(json.dumps(h,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print('D4_SUPPORT_HASH_GATE_PASS evidence=90 relations=24 dossiers=15 missions=15')

      - name: Run source, OTNT, grading and accessibility validators
        run: |
          cd /tmp/d4src
          python -m py_compile tools/validate_ot_r06_d4.py tools/test_ot_r06_d4_d5_contract.py
          python tools/validate_ot_r06_d4.py
          python tools/test_ot_r06_d4_d5_contract.py

      - name: Build stage05 materialization manifest
        shell: python
        run: |
          import json, hashlib, pathlib, subprocess
          out=pathlib.Path('docs/campaigns/OT/R06_D4_STAGE05_CANONICAL')
          files=[]
          for p in sorted(x for x in out.rglob('*') if x.is_file()):
              b=p.read_bytes(); files.append({'path':str(p).replace('\\','/'),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={'schema':'D4_RECORD_HASH_MATERIALIZATION_MANIFEST_v1','source_package':'DEV_LANE_SCRIPTURE_R06_D4_CLOSURE_03.zip','source_drive_id':'1LSrCc1M8DcqRBwpO2NAVmcB9EzazgMDq','source_sha256':'c4e8dfe4ea62df2c3d52b810fb2413b31d6dcfd4cc711320beae3258ac6a981a','source_branch_head':'2417976b7b874db44f77a815d560ccafafbec061','canonical_serialization':'UTF-8 JSON ensure_ascii=false sort_keys=true separators=(comma,colon)','counts':{'nodes':450,'evidence':90,'relations':24,'dossiers':15,'missions':15},'node_record_aggregate_sha256':'ffb5fc49efaa42e4cd5b5a665f3b027a427a03498758b6622bb91649ea0dce5f','h1_repair_count':63,'files':files}
          (out/'D4_RECORD_HASH_MATERIALIZATION_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('materialized_files',len(files)+1)

      - name: Commit readable canonical D4 stage05 corpus
        run: |
          git config user.name 'scripture-archive-devc-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/campaigns/OT/R06_D4_STAGE05_CANONICAL
          if git diff --cached --quiet; then
            echo 'No D4 stage05 materialization delta.'
          else
            git commit -m 'R06 DEV-C stage05: materialize hash-gated readable D4 corpus'
            git push origin HEAD:r06-3dev-c-d4-materialization-05
          fi
          git rev-parse HEAD
