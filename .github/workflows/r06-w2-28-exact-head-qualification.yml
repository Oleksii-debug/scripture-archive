name: R06 W2-28 Exact Head Qualification

on:
  push:
    branches:
      - r06-qa-w2-28-4688b193-0913-sol
    paths:
      - '.github/workflows/r06-w2-28-exact-head-qualification.yml'

permissions:
  contents: read

jobs:
  exact-head-source-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 4688b19301642e6f6a8fd2d26e48f73dc79a3cc4
      EXPECTED_BASE: a1dceca4783a1d8abe4f5b3de7103d60d4c0e344
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4688b19301642e6f6a8fd2d26e48f73dc79a3cc4
          fetch-depth: 0
      - name: Confirm exact candidate containment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          git diff --name-only "$EXPECTED_BASE" "$EXPECTED_HEAD" > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          docs/campaigns/GW/R06_DEV3_MATERIALIZATION_05/W2_28_NODE_SHARD_PROOF.json
          docs/campaigns/GW/R06_DEV3_MATERIALIZATION_05/nodes/w2_28_src_013_missing.jsonl
          docs/campaigns/GW/R06_DEV3_MATERIALIZATION_05/nodes/w2_28_src_014_missing.jsonl
          docs/campaigns/GW/R06_DEV3_MATERIALIZATION_05/nodes/w2_28_src_015_missing.jsonl
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Reconstruct immutable closure
        shell: bash
        run: |
          set -euo pipefail
          STAGE=lanes/dev3/closure03_payload
          test "$(find "$STAGE" -maxdepth 1 -name 'part_*.b64' -type f | wc -l)" -eq 51
          rm -rf /tmp/w2-28-qa
          mkdir -p /tmp/w2-28-qa/source
          cat "$STAGE"/part_*.b64 | base64 --decode > /tmp/w2-28-qa/payload.tar.xz
          echo 'ea8e4d290101a6b1c95e3718844015b90abda0964705bf24b70309fa6062c35a  /tmp/w2-28-qa/payload.tar.xz' | sha256sum -c -
          tar -xJf /tmp/w2-28-qa/payload.tar.xz -C /tmp/w2-28-qa/source
      - name: Verify exact source readback and proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          source = pathlib.Path('/tmp/w2-28-qa/source')
          root = pathlib.Path('docs/campaigns/GW/R06_DEV3_MATERIALIZATION_05')
          proof = json.loads((root / 'W2_28_NODE_SHARD_PROOF.json').read_text(encoding='utf-8'))
          assert proof['schema'] == 'W2_28_D3_NODE_SHARD_PROOF_v2'
          assert proof['status'] == 'PASS'
          assert proof['source_truth_changed'] is False
          assert proof['global_manifest_or_status_changed'] is False
          assert proof['source_archive_sha256'] == 'ea8e4d290101a6b1c95e3718844015b90abda0964705bf24b70309fa6062c35a'
          assert proof['closure_manifest_sha256'] == '7a8bcd3a92a15d03004154fc85fbbc5ace9faa62bc3b2bc2c3564c68f62c94cd'
          assert proof['full_node_aggregate_sha256'] == '403d1aa3c22b8bea49b60c59512e53ae7ab0c389c21101a83f7b90898cbbc240'
          assert proof['selected_record_count'] == 72
          assert proof['new_record_count'] == 72
          assert proof['preexisting_record_count_in_selected_range'] == 0
          assert proof['skipped_existing_node_ids'] == []
          assert proof['ownership']['source_file_indexes_1_based'] == [13,14,15]

          sums = {}
          lines = (source / 'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines()
          for line in lines:
              if not line.strip(): continue
              digest, rel = line.split(None, 1)
              rel = rel.strip().lstrip('*')
              path = source / rel
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
              sums[rel] = digest
          assert len(sums) == 29
          manifest_path = source / 'GW_GITHUB_MATERIALIZATION_MANIFEST_v1.2.json'
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest() == proof['closure_manifest_sha256']
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['node_count'] == 360
          assert manifest['source_truth_freeze'] == proof['closure_source_truth_freeze']

          source_files = sorted((source / 'nodes').glob('*.json'))
          assert len(source_files) == 15
          all_nodes = []
          by_source = []
          for path in source_files:
              data = json.loads(path.read_text(encoding='utf-8'))
              assert len(data['nodes']) == 24
              all_nodes += data['nodes']
              by_source.append((path, data['nodes']))
          assert len(all_nodes) == 360
          assert len({n['node_id'] for n in all_nodes}) == 360

          def cb(record):
              return json.dumps(record, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          hashes = {n['node_id']: hashlib.sha256(cb(n)).hexdigest() for n in all_nodes}
          aggregate = hashlib.sha256(''.join(f'{k}\t{v}\n' for k,v in sorted(hashes.items())).encode()).hexdigest()
          assert aggregate == proof['full_node_aggregate_sha256'] == '403d1aa3c22b8bea49b60c59512e53ae7ab0c389c21101a83f7b90898cbbc240'

          selected = by_source[12:15]
          assert [p.name for p,_ in selected] == ['GW-13_NODES_v1.2.json','GW-14_NODES_v1.2.json','GW-15_NODES_v1.2.json']
          expected_ids = [n['node_id'] for _,nodes in selected for n in nodes]
          assert len(expected_ids) == 72 and len(set(expected_ids)) == 72
          assert expected_ids == [f'GW{gw:02d}-N{n:02d}' for gw in range(13,16) for n in range(1,25)]

          proof_outputs = {o['source_index']: o for o in proof['outputs']}
          seen = []
          for idx,(src,nodes) in zip((13,14,15), selected):
              out = root / 'nodes' / f'w2_28_src_{idx:03d}_missing.jsonl'
              raw = out.read_bytes()
              expected_raw = b''.join(cb(n) + b'\n' for n in nodes)
              assert raw == expected_raw, idx
              assert hashlib.sha256(raw).hexdigest() == proof_outputs[idx]['output_sha256']
              records = [json.loads(line) for line in raw.decode('utf-8').splitlines() if line.strip()]
              assert len(records) == 24
              assert proof_outputs[idx]['source_file_sha256'] == sums[f'nodes/{src.name}']
              seen += [r['node_id'] for r in records]
          assert seen == expected_ids
          assert len(set(seen)) == 72
          print('PR171_EXACT_HEAD_SOURCE_READBACK_PASS records=72 closure_nodes=360 aggregate=' + aggregate)
          PY
      - name: Diff hygiene
        shell: bash
        run: git diff --check "$EXPECTED_BASE" "$EXPECTED_HEAD"
