name: R06 W2-28 D3 Nodes 013-015

on:
  push:
    branches:
      - r06-wave2-w28-d3-nodes-013-015-0913-sol
    paths:
      - '.github/workflows/r06-w2-28-d3-nodes-013-015.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-owned-range:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r06-wave2-w28-d3-nodes-013-015-0913-sol
          fetch-depth: 0

      - name: Reconstruct exact immutable closure transport
        shell: bash
        run: |
          set -euo pipefail
          STAGE=lanes/dev3/closure03_payload
          test "$(find "$STAGE" -maxdepth 1 -name 'part_*.b64' -type f | wc -l)" -eq 51
          rm -rf /tmp/w2-28
          mkdir -p /tmp/w2-28/source
          cat "$STAGE"/part_*.b64 | base64 --decode > /tmp/w2-28/payload.tar.xz
          echo 'ea8e4d290101a6b1c95e3718844015b90abda0964705bf24b70309fa6062c35a  /tmp/w2-28/payload.tar.xz' | sha256sum -c -
          tar -xJf /tmp/w2-28/payload.tar.xz -C /tmp/w2-28/source

      - name: Verify closure identity and materialize only source files 013-015
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          source = pathlib.Path('/tmp/w2-28/source')
          target = pathlib.Path('docs/campaigns/GW/R06_DEV3_MATERIALIZATION_05/nodes')
          proof_path = pathlib.Path('docs/campaigns/GW/R06_DEV3_MATERIALIZATION_05/W2_28_NODE_SHARD_PROOF.json')

          sums = source / 'SHA256SUMS.txt'
          assert sums.is_file(), sums
          expected_file_hash = {}
          checked = 0
          for line in sums.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              expected, rel = line.split(None, 1)
              rel = rel.strip().lstrip('*')
              path = source / rel
              assert path.is_file(), path
              got = hashlib.sha256(path.read_bytes()).hexdigest()
              assert got == expected, (rel, expected, got)
              expected_file_hash[rel] = expected
              checked += 1
          assert checked == 29, checked

          manifest_name = 'GW_GITHUB_MATERIALIZATION_MANIFEST_v1.2.json'
          manifest_path = source / manifest_name
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          assert manifest_sha == '7a8bcd3a92a15d03004154fc85fbbc5ace9faa62bc3b2bc2c3564c68f62c94cd', manifest_sha
          assert expected_file_hash[manifest_name] == manifest_sha
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['schema'] == 'GW_GITHUB_MATERIALIZATION_MANIFEST_v1.2'
          assert manifest['lane'] == 'DEV3'
          assert manifest['round'] == 'R06'
          assert manifest['stage'] == 'FINALPREP_02'
          assert manifest['node_count'] == 360
          expected_freeze = (
              'Only success_feedback, partial_feedback, failure_feedback and hints differ from DEV3 REPAIR_01; '
              'all answer/source/evidence/confidence/TX1/witness/branch/mastery/accessibility fields are preserved.'
          )
          assert manifest['source_truth_freeze'] == expected_freeze

          source_files = sorted((source / 'nodes').glob('*.json'))
          assert len(source_files) == 15, len(source_files)
          manifest_node_files = {entry['path']: entry for entry in manifest['node_files']}
          assert len(manifest_node_files) == 15

          all_nodes = []
          by_source = []
          for path in source_files:
              rel = f'nodes/{path.name}'
              entry = manifest_node_files[rel]
              raw = path.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == entry['sha256'] == expected_file_hash[rel]
              data = json.loads(raw)
              nodes = data['nodes']
              assert len(nodes) == entry['node_count'] == 24
              assert data.get('mission_id', entry['mission_id']) == entry['mission_id']
              by_source.append((path, nodes))
              all_nodes.extend(nodes)

          assert len(all_nodes) == 360
          ids = [node.get('node_id') for node in all_nodes]
          assert all(isinstance(node_id, str) and node_id for node_id in ids)
          assert len(set(ids)) == 360

          def canonical_bytes(record):
              return json.dumps(record, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')

          canonical_hash = {
              node['node_id']: hashlib.sha256(canonical_bytes(node)).hexdigest()
              for node in all_nodes
          }
          aggregate_payload = ''.join(
              f'{node_id}\t{digest}\n' for node_id, digest in sorted(canonical_hash.items())
          ).encode('utf-8')
          aggregate = hashlib.sha256(aggregate_payload).hexdigest()
          expected_closure_aggregate = '403d1aa3c22b8bea49b60c59512e53ae7ab0c389c21101a83f7b90898cbbc240'
          legacy_repair01_aggregate = '6bc9ceadb9a02f7eef92cf70df004f3781a3e85732b1f5d17cd93c2e876896e6'
          assert aggregate == expected_closure_aggregate, (expected_closure_aggregate, aggregate)
          assert aggregate != legacy_repair01_aggregate

          existing = {}
          target.mkdir(parents=True, exist_ok=True)
          for path in sorted(target.glob('*.jsonl')):
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if not line.strip():
                      continue
                  record = json.loads(line)
                  node_id = record.get('node_id')
                  assert isinstance(node_id, str) and node_id, (path, line_no)
                  digest = hashlib.sha256(canonical_bytes(record)).hexdigest()
                  if node_id in existing:
                      assert existing[node_id] == digest, ('existing duplicate mismatch', node_id)
                  existing[node_id] = digest

          selected = by_source[12:15]
          assert [p.name for p, _ in selected] == [
              'GW-13_NODES_v1.2.json',
              'GW-14_NODES_v1.2.json',
              'GW-15_NODES_v1.2.json',
          ]
          selected_ids = [node['node_id'] for _, nodes in selected for node in nodes]
          assert len(selected_ids) == 72 and len(set(selected_ids)) == 72
          assert selected_ids[0] == 'GW13-N01'
          assert selected_ids[-1] == 'GW15-N24'

          outputs = []
          skipped = []
          written_ids = []
          for source_index, (src_path, nodes) in enumerate(selected, 13):
              missing = []
              for node in nodes:
                  node_id = node['node_id']
                  if node_id in existing:
                      assert existing[node_id] == canonical_hash[node_id], ('readable/source mismatch', node_id)
                      skipped.append(node_id)
                  else:
                      missing.append(node)
              out_path = target / f'w2_28_src_{source_index:03d}_missing.jsonl'
              if out_path.exists():
                  out_path.unlink()
              if missing:
                  payload = b''.join(canonical_bytes(node) + b'\n' for node in missing)
                  out_path.write_bytes(payload)
                  outputs.append({
                      'source_index': source_index,
                      'source_file': src_path.name,
                      'source_file_sha256': expected_file_hash[f'nodes/{src_path.name}'],
                      'output_path': out_path.as_posix(),
                      'record_count': len(missing),
                      'first_node_id': missing[0]['node_id'],
                      'last_node_id': missing[-1]['node_id'],
                      'output_sha256': hashlib.sha256(payload).hexdigest(),
                  })
                  written_ids.extend(node['node_id'] for node in missing)

          assert not (set(written_ids) & set(existing))
          assert set(written_ids) | set(skipped) == set(selected_ids)
          assert len(written_ids) + len(skipped) == 72

          proof = {
              'schema': 'W2_28_D3_NODE_SHARD_PROOF_v2',
              'status': 'PASS',
              'ownership': {
                  'source_file_indexes_1_based': [13, 14, 15],
                  'source_file_count_total': len(source_files),
                  'existing_ids_are_skipped': True,
              },
              'source_transport': 'lanes/dev3/closure03_payload/part_*.b64',
              'source_archive_sha256': 'ea8e4d290101a6b1c95e3718844015b90abda0964705bf24b70309fa6062c35a',
              'source_file_hashes_checked': checked,
              'closure_manifest_sha256': manifest_sha,
              'closure_source_truth_freeze': manifest['source_truth_freeze'],
              'full_node_count': len(all_nodes),
              'full_unique_node_ids': len(set(ids)),
              'full_node_aggregate_sha256': aggregate,
              'expected_closure_node_aggregate_sha256': expected_closure_aggregate,
              'legacy_repair01_node_aggregate_sha256_not_used_as_closure_identity': legacy_repair01_aggregate,
              'selected_record_count': len(selected_ids),
              'preexisting_record_count_in_selected_range': len(skipped),
              'new_record_count': len(written_ids),
              'skipped_existing_node_ids': skipped,
              'new_node_ids': written_ids,
              'outputs': outputs,
              'source_truth_changed': False,
              'global_manifest_or_status_changed': False,
          }
          proof_path.write_text(json.dumps(proof, ensure_ascii=False, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(
              'W2_28_D3_SHARD_PASS '
              f'selected={len(selected_ids)} skipped={len(skipped)} new={len(written_ids)} '
              f'closure_aggregate={aggregate}'
          )
          PY

      - name: Commit only W2-28 immutable shard and proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/campaigns/GW/R06_DEV3_MATERIALIZATION_05/nodes/w2_28_src_*_missing.jsonl \
            docs/campaigns/GW/R06_DEV3_MATERIALIZATION_05/W2_28_NODE_SHARD_PROOF.json
          git diff --cached --name-only
          git diff --cached --quiet && { echo 'No missing records in W2-28 owned range.'; exit 0; }
          git commit -m 'R06 W2-28: materialize verified D3 source files 013-015 [skip ci]'
          git push origin HEAD:r06-wave2-w28-d3-nodes-013-015-0913-sol
