[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scripture-archive-runtime"
version = "0.6.1.dev5repair1"
description = "UI-neutral game/domain runtime for Scripture Archive R06"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["scripture_archive_runtime"]

[tool.setuptools.package-data]
scripture_archive_runtime = ["data/*.json"]
