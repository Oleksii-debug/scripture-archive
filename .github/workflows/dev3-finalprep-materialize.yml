name: DEV3 Finalprep Corpus Materialization

on:
  push:
    branches:
      - r06-dev3-gospels-finalprep-02
    paths:
      - lanes/dev3/finalprep_payload/READY
      - lanes/dev3/finalprep_payload/TEST_TRIGGER

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: r06-dev3-gospels-finalprep-02
          fetch-depth: 0
      - name: Probe or materialize
        shell: bash
        run: |
          set -euo pipefail
          if [ -f lanes/dev3/finalprep_payload/TEST_TRIGGER ] && [ ! -f lanes/dev3/finalprep_payload/READY ]; then
            printf 'DEV3 Ubuntu Actions write-back probe PASS\n' > lanes/dev3/ACTIONS_PROBE_OK.txt
          else
            test -f lanes/dev3/finalprep_payload/READY
            mkdir -p /tmp/dev3payload
            cat lanes/dev3/finalprep_payload/chunk_*.b64 | base64 --decode > /tmp/dev3payload/payload.zip
            echo 'b2da1210221b2f682a5e991df325e38403c170aafe51e2fbc9f152c3d35c47dd  /tmp/dev3payload/payload.zip' | sha256sum -c -
            rm -rf docs/campaigns/GW/R06_DEV3_FINALPREP_02
            mkdir -p docs/campaigns/GW/R06_DEV3_FINALPREP_02
            unzip -q /tmp/dev3payload/payload.zip -d docs/campaigns/GW/R06_DEV3_FINALPREP_02
            python - <<'PY'
          import json, pathlib
          root=pathlib.Path('docs/campaigns/GW/R06_DEV3_FINALPREP_02')
          files=list((root/'nodes').glob('*.json'))
          nodes=[]
          for p in files:
              nodes.extend(json.loads(p.read_text(encoding='utf-8'))['nodes'])
          assert len(nodes)==360
          assert len({n['node_id'] for n in nodes})==360
          assert sum(n['textual_variant_flag']=='TX1' for n in nodes)==22
          print('materialized_nodes=360 unique=360 tx1=22')
          PY
            rm -rf lanes/dev3/finalprep_payload
          fi
      - name: Commit materialized readable files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- lanes/dev3 docs/campaigns/GW/R06_DEV3_FINALPREP_02
          if git diff --cached --quiet; then
            echo 'No materialization changes to commit.'
            exit 0
          fi
          git commit -m 'R06 DEV3 finalprep: materialize readable Gospel corpus [skip ci]'
          git push origin HEAD:r06-dev3-gospels-finalprep-02
