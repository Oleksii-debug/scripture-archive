name: Scripture source verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-verification.yml'
      - 'app/**'
      - 'components/**'
      - 'db/**'
      - 'drizzle/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: scripture-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR merge candidate
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install immutable dependencies
        run: npm ci
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Check ESLint
        run: npm run lint
      - name: Run regression tests
        run: npm test
      - name: Build source (no deployment)
        run: npm run build
      - name: Run disposable Worker and D1 integration tests
        run: npm run test:integration
