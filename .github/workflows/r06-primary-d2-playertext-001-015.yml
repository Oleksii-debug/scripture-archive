name: R06 Primary D2 corrected player text parts 001-015

on:
  push:
    branches:
      - r06-primary-d2-playertext-parts001-015-0928-sol
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r06-primary-d2-playertext-parts001-015
  cancel-in-progress: false

jobs:
  correct-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact immutable D2 baseline
        shell: bash
        run: |
          set -euo pipefail
          source_commit="0e913d3cb001ec3f5dff3e6aa0a61069d05ed101"
          source_path="release_inputs/dev2_w2_24/DEV_B_STAGE05_RECORD_SPLIT_STAGING.zip"
          expected_zip="b681ea26d985eb754bde02a77254d40ab0920061edb9226fae7921a6740a06c0"
          transport="$RUNNER_TEMP/d2-stage05.zip"
          git fetch --no-tags origin "$source_commit"
          git show "$source_commit:$source_path" > "$transport"
          actual="$(sha256sum "$transport" | awk '{print $1}')"
          test "$actual" = "$expected_zip"
          unzip -t "$transport" >/dev/null
          rm -rf "$RUNNER_TEMP/d2-stage05"
          mkdir -p "$RUNNER_TEMP/d2-stage05"
          unzip -q "$transport" -d "$RUNNER_TEMP/d2-stage05"
          test -d "$RUNNER_TEMP/d2-stage05/D2_MATERIALIZATION/nodes"
          echo "D2_PRIMARY_001_015_BASELINE_ZIP_PASS=$actual"

      - name: Produce bounded corrected derivatives and proof
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/d2-stage05/D2_MATERIALIZATION" <<'PY'
          import copy
          import hashlib
          import json
          import pathlib
          import sys

          baseline_root = pathlib.Path(sys.argv[1])
          output_root = pathlib.Path("docs/campaigns/PA/R06_PRIMARY_D2_CORRECTED_001_015")
          nodes_out = output_root / "nodes"
          nodes_out.mkdir(parents=True, exist_ok=True)

          parts = [f"part_{i:03d}.jsonl" for i in range(1, 16)]
          mutable_top = {
              "player_prompt", "success_feedback", "partial_feedback", "failure_feedback",
              "rejection_reason", "functional_nonvisual_equivalent",
          }
          mutable_mapping = {"hints"}
          mutable_list = {"rejected_answers"}
          replacements = (
              ("локальному твердження", "локальному твердженню"),
              ("оцінювання обмежений", "оцінювання обмежене"),
              ("джерельна атрибуція for ", "джерельна атрибуція для "),
              ("identify мовця", "визначення мовця"),
              ("audience quoted by наратор Дій", "слухачі, процитовані оповідачем Дій"),
              ("an unnamed harmonized source voice", "невизначений гармонізований голос джерела"),
              ("source voice", "голос джерела"),
              ("свідчення/source", "свідчення/джерела"),
          )
          forbidden_after = tuple(old for old, _ in replacements)

          def canonical(value):
              return json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")

          def sha(value):
              return hashlib.sha256(value).hexdigest()

          def protected(record):
              return {
                  key: value
                  for key, value in record.items()
                  if key not in mutable_top
                  and key not in mutable_mapping
                  and key not in mutable_list
              }

          occurrence_counts = {}

          def fix_text(text):
              result = text
              for old, new in replacements:
                  count = result.count(old)
                  if count:
                      occurrence_counts[old] = occurrence_counts.get(old, 0) + count
                      result = result.replace(old, new)
              return result

          index = json.loads(
              (baseline_root / "node_hash_index.json").read_text(encoding="utf-8")
          )
          indexed = {
              item["id"]: item
              for item in index.get("records", [])
              if isinstance(item, dict) and isinstance(item.get("id"), str)
          }
          if len(indexed) != 386:
              raise SystemExit(
                  f"D2_PRIMARY_001_015_BASELINE_INDEX_COUNT_FAIL {len(indexed)}"
              )

          report_rows = []
          all_baseline = {}
          all_candidate = {}

          for part in parts:
              src = baseline_root / "nodes" / part
              if not src.is_file():
                  raise SystemExit(f"D2_PRIMARY_001_015_BASELINE_PART_MISSING {part}")

              corrected_lines = []
              part_records = 0

              for line_no, line in enumerate(
                  src.read_text(encoding="utf-8").splitlines(), 1
              ):
                  if not line.strip():
                      continue

                  baseline = json.loads(line)
                  if not isinstance(baseline, dict):
                      raise SystemExit(
                          f"D2_PRIMARY_001_015_NON_OBJECT {part}:{line_no}"
                      )

                  node_id = baseline.get("node_id")
                  if (
                      not isinstance(node_id, str)
                      or not node_id
                      or node_id in all_baseline
                  ):
                      raise SystemExit(
                          f"D2_PRIMARY_001_015_NODE_ID_FAIL {part}:{line_no}:{node_id}"
                      )

                  baseline_sha = sha(canonical(baseline))
                  indexed_item = indexed.get(node_id)
                  if not indexed_item or indexed_item.get("sha256") != baseline_sha:
                      raise SystemExit(
                          f"D2_PRIMARY_001_015_BASELINE_HASH_FAIL {node_id}"
                      )
                  indexed_part = str(indexed_item.get("part") or "")
                  if indexed_part and not indexed_part.endswith(part):
                      raise SystemExit(
                          f"D2_PRIMARY_001_015_BASELINE_PART_INDEX_FAIL "
                          f"{node_id}:{indexed_part}:{part}"
                      )

                  candidate = copy.deepcopy(baseline)
                  changed_paths = []

                  for field in sorted(mutable_top):
                      if field in candidate:
                          if not isinstance(candidate[field], str):
                              raise SystemExit(
                                  f"D2_PRIMARY_001_015_MUTABLE_TYPE_FAIL "
                                  f"{node_id}:{field}"
                              )
                          new = fix_text(candidate[field])
                          if new != candidate[field]:
                              candidate[field] = new
                              changed_paths.append(field)

                  for field in sorted(mutable_mapping):
                      value = candidate.get(field)
                      if (
                          not isinstance(value, dict)
                          or not all(isinstance(v, str) for v in value.values())
                      ):
                          raise SystemExit(
                              f"D2_PRIMARY_001_015_MUTABLE_MAPPING_FAIL "
                              f"{node_id}:{field}"
                          )
                      for key in sorted(value):
                          new = fix_text(value[key])
                          if new != value[key]:
                              value[key] = new
                              changed_paths.append(f"{field}.{key}")

                  for field in sorted(mutable_list):
                      value = candidate.get(field)
                      if (
                          not isinstance(value, list)
                          or not all(isinstance(v, str) for v in value)
                      ):
                          raise SystemExit(
                              f"D2_PRIMARY_001_015_MUTABLE_LIST_FAIL "
                              f"{node_id}:{field}"
                          )
                      for idx, old_value in enumerate(list(value)):
                          new = fix_text(old_value)
                          if new != old_value:
                              value[idx] = new
                              changed_paths.append(f"{field}[{idx}]")

                  if protected(baseline) != protected(candidate):
                      raise SystemExit(
                          f"D2_PRIMARY_001_015_PROTECTED_PROJECTION_FAIL {node_id}"
                      )

                  candidate_text = "\n".join(
                      [
                          candidate.get(field, "")
                          for field in sorted(mutable_top)
                          if isinstance(candidate.get(field), str)
                      ]
                      + [
                          value
                          for field in sorted(mutable_mapping)
                          for value in candidate.get(field, {}).values()
                      ]
                      + [
                          value
                          for field in sorted(mutable_list)
                          for value in candidate.get(field, [])
                      ]
                  )
                  leaked = [
                      pattern for pattern in forbidden_after if pattern in candidate_text
                  ]
                  if leaked:
                      raise SystemExit(
                          f"D2_PRIMARY_001_015_ARTIFACT_REMAINS {node_id}:{leaked}"
                      )
                  if not changed_paths:
                      raise SystemExit(
                          f"D2_PRIMARY_001_015_EXPECTED_PLAYER_TEXT_CHANGE_MISSING "
                          f"{node_id}"
                      )

                  corrected_sha = sha(canonical(candidate))
                  corrected_lines.append(canonical(candidate).decode("utf-8"))
                  report_rows.append(
                      {
                          "node_id": node_id,
                          "source_part": f"nodes/{part}",
                          "changed_player_paths": changed_paths,
                          "baseline_record_sha256": baseline_sha,
                          "corrected_record_sha256": corrected_sha,
                          "protected_projection_sha256": sha(
                              canonical(protected(baseline))
                          ),
                      }
                  )
                  all_baseline[node_id] = baseline_sha
                  all_candidate[node_id] = corrected_sha
                  part_records += 1

              if part_records == 0:
                  raise SystemExit(f"D2_PRIMARY_001_015_EMPTY_PART {part}")

              (nodes_out / part).write_text(
                  "\n".join(corrected_lines) + "\n", encoding="utf-8"
              )

          count = len(report_rows)
          if count != 230:
              raise SystemExit(
                  f"D2_PRIMARY_001_015_EXPECTED_NODE_COUNT_FAIL {count} != 230"
              )
          if occurrence_counts.get("локальному твердження", 0) < count:
              raise SystemExit(
                  "D2_PRIMARY_001_015_SYSTEMIC_LOCAL_CLAIM_BASELINE_COUNT_FAIL"
              )
          if occurrence_counts.get("оцінювання обмежений", 0) < count:
              raise SystemExit(
                  "D2_PRIMARY_001_015_SYSTEMIC_GRADING_BASELINE_COUNT_FAIL"
              )

          def aggregate(mapping):
              payload = "".join(
                  f"{node_id}\t{mapping[node_id]}\n"
                  for node_id in sorted(mapping)
              ).encode("utf-8")
              return sha(payload)

          report = {
              "schema": "R06_D2_PRIMARY_PLAYER_TEXT_CORRECTION_001_015_v1",
              "status": "PASS",
              "source": {
                  "staging_zip_sha256":
                      "b681ea26d985eb754bde02a77254d40ab0920061edb9226fae7921a6740a06c0",
                  "parts": [f"nodes/{part}" for part in parts],
              },
              "scope": {
                  "node_count": count,
                  "mutable_top_level_text_fields": sorted(mutable_top),
                  "mutable_mapping_text_fields": sorted(mutable_mapping),
                  "mutable_list_text_fields": sorted(mutable_list),
                  "all_other_fields": "IMMUTABLE_FAIL_CLOSED",
              },
              "artifact_replacements": [
                  {
                      "from": old,
                      "to": new,
                      "occurrences": occurrence_counts.get(old, 0),
                  }
                  for old, new in replacements
              ],
              "selected_baseline_aggregate_sha256": aggregate(all_baseline),
              "selected_corrected_aggregate_sha256": aggregate(all_candidate),
              "changes": sorted(report_rows, key=lambda row: row["node_id"]),
              "independent_audit": "PENDING",
              "source_truth_changed": False,
          }

          (output_root / "CORRECTION_REPORT.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )

          print(
              "D2_PRIMARY_001_015_CORRECTION_PASS",
              f"nodes={count}",
              f"baseline={report['selected_baseline_aggregate_sha256']}",
              f"corrected={report['selected_corrected_aggregate_sha256']}",
          )
          PY

      - name: Guard mutation scope and commit corrected derivatives
        shell: bash
        run: |
          set -euo pipefail
          root="docs/campaigns/PA/R06_PRIMARY_D2_CORRECTED_001_015"
          python - <<'PY'
          import subprocess

          allowed = "docs/campaigns/PA/R06_PRIMARY_D2_CORRECTED_001_015/"
          changed = []
          for line in subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"], text=True
          ).splitlines():
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.append(path)

          unexpected = [path for path in changed if not path.startswith(allowed)]
          if unexpected:
              raise SystemExit(
                  f"D2_PRIMARY_001_015_UNEXPECTED_MUTATION {unexpected}"
              )

          expected = {
              allowed + f"nodes/part_{i:03d}.jsonl" for i in range(1, 16)
          } | {allowed + "CORRECTION_REPORT.json"}

          missing = sorted(expected - set(changed))
          if missing:
              if changed:
                  raise SystemExit(
                      f"D2_PRIMARY_001_015_EXPECTED_OUTPUT_MISSING {missing}"
                  )
              print("D2_PRIMARY_001_015_ALREADY_MATERIALIZED")
          else:
              print("D2_PRIMARY_001_015_MUTATION_SCOPE_PASS", len(changed))
          PY

          if git status --porcelain -- "$root" | grep -q .; then
            git config user.name "scripture-archive-primary-d2"
            git config user.email "actions@users.noreply.github.com"
            git add -A "$root"
            git diff --cached --check
            git commit -m "R06: correct D2 player text for parts 001-015"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
